# Tyk AI Microgateway - GoReleaser Configuration
# This file is NOT managed by gromit policy.
#
# This project needs CGO_ENABLED=1 and the cross-compiler toolchains for
# - arm64
# - amd64
version: 2
builds:
  # ---------------------------------------------------------------------------
  # Server builds
  # ---------------------------------------------------------------------------
  - id: mgw-std-amd64
    dir: microgateway
    main: ./cmd/microgateway
    ldflags:
      - -X main.Version={{.Version}}
      - -X main.BuildHash={{.FullCommit}}
      - -X main.BuildTime={{.Date}}
      - -X main.BuiltBy=goreleaser
    goos:
      - linux
    goarch:
      - amd64
    binary: tyk-microgateway
    hooks:
      post:
        - cmd: scripts/fips-verify.sh --edition {{ .Env.EDITION }} --std "{{ .Path }}"
  - id: mgw-std-arm64
    dir: microgateway
    main: ./cmd/microgateway
    env:
      - CC=aarch64-linux-gnu-gcc
    ldflags:
      - -X main.Version={{.Version}}
      - -X main.BuildHash={{.FullCommit}}
      - -X main.BuildTime={{.Date}}
      - -X main.BuiltBy=goreleaser
    goos:
      - linux
    goarch:
      - arm64
    binary: tyk-microgateway
    hooks:
      post:
        - cmd: scripts/fips-verify.sh --edition {{ .Env.EDITION }} --std "{{ .Path }}"
  - id: mgw-std-s390x
    dir: microgateway
    main: ./cmd/microgateway
    env:
      - CC=s390x-linux-gnu-gcc
    ldflags:
      - -X main.Version={{.Version}}
      - -X main.BuildHash={{.FullCommit}}
      - -X main.BuildTime={{.Date}}
      - -X main.BuiltBy=goreleaser
    goos:
      - linux
    goarch:
      - s390x
    binary: tyk-microgateway
    hooks:
      post:
        - cmd: scripts/fips-verify.sh --edition {{ .Env.EDITION }} --std "{{ .Path }}"
  - id: mgw-fips-amd64
    dir: microgateway
    main: ./cmd/microgateway
    # GOFIPS140 pins the frozen, CMVP-validated module, not the toolchain's
    # latest. The fips tag is Tyk's marker for FIPS builds. Command-line
    # -tags replace the GOFLAGS ones, so the enterprise tag is repeated here.
    env:
      - GOFIPS140=v1.0.0
    flags:
      - -trimpath
      - -tags=fips{{ if eq .Env.EDITION "ent" }},enterprise{{ end }}
    ldflags:
      - -X main.Version={{.Version}}
      - -X main.BuildHash={{.FullCommit}}
      - -X main.BuildTime={{.Date}}
      - -X main.BuiltBy=goreleaser
    goos:
      - linux
    goarch:
      - amd64
    binary: tyk-microgateway
    hooks:
      post:
        - cmd: scripts/fips-verify.sh --edition {{ .Env.EDITION }} --fips "{{ .Path }}"
  - id: mgw-fips-arm64
    dir: microgateway
    main: ./cmd/microgateway
    # GOFIPS140 pins the frozen, CMVP-validated module, not the toolchain's
    # latest. The fips tag is Tyk's marker for FIPS builds. Command-line
    # -tags replace the GOFLAGS ones, so the enterprise tag is repeated here.
    env:
      - GOFIPS140=v1.0.0
      - CC=aarch64-linux-gnu-gcc
    flags:
      - -trimpath
      - -tags=fips{{ if eq .Env.EDITION "ent" }},enterprise{{ end }}
    ldflags:
      - -X main.Version={{.Version}}
      - -X main.BuildHash={{.FullCommit}}
      - -X main.BuildTime={{.Date}}
      - -X main.BuiltBy=goreleaser
    goos:
      - linux
    goarch:
      - arm64
    binary: tyk-microgateway
    hooks:
      post:
        - cmd: scripts/fips-verify.sh --edition {{ .Env.EDITION }} --fips "{{ .Path }}"
  - id: mgw-fips-s390x
    dir: microgateway
    main: ./cmd/microgateway
    # GOFIPS140 pins the frozen, CMVP-validated module, not the toolchain's
    # latest. The fips tag is Tyk's marker for FIPS builds. Command-line
    # -tags replace the GOFLAGS ones, so the enterprise tag is repeated here.
    env:
      - GOFIPS140=v1.0.0
      - CC=s390x-linux-gnu-gcc
    flags:
      - -trimpath
      - -tags=fips{{ if eq .Env.EDITION "ent" }},enterprise{{ end }}
    ldflags:
      - -X main.Version={{.Version}}
      - -X main.BuildHash={{.FullCommit}}
      - -X main.BuildTime={{.Date}}
      - -X main.BuiltBy=goreleaser
    goos:
      - linux
    goarch:
      - s390x
    binary: tyk-microgateway
    hooks:
      post:
        - cmd: scripts/fips-verify.sh --edition {{ .Env.EDITION }} --fips "{{ .Path }}"
  # ---------------------------------------------------------------------------
  # CLI builds (mgw command-line tool, bundled in the same package)
  # ---------------------------------------------------------------------------
  - id: mgw-cli-amd64
    dir: microgateway
    main: ./cmd/mgw
    ldflags:
      - -X main.Version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64
    binary: mgw
    hooks:
      post:
        - cmd: scripts/fips-verify.sh --edition {{ .Env.EDITION }} --std "{{ .Path }}"
  - id: mgw-cli-arm64
    dir: microgateway
    main: ./cmd/mgw
    env:
      - CC=aarch64-linux-gnu-gcc
    ldflags:
      - -X main.Version={{.Version}}
    goos:
      - linux
    goarch:
      - arm64
    binary: mgw
    hooks:
      post:
        - cmd: scripts/fips-verify.sh --edition {{ .Env.EDITION }} --std "{{ .Path }}"
  - id: mgw-cli-s390x
    dir: microgateway
    main: ./cmd/mgw
    env:
      - CC=s390x-linux-gnu-gcc
    ldflags:
      - -X main.Version={{.Version}}
    goos:
      - linux
    goarch:
      - s390x
    binary: mgw
    hooks:
      post:
        - cmd: scripts/fips-verify.sh --edition {{ .Env.EDITION }} --std "{{ .Path }}"
  - id: mgw-cli-fips-amd64
    dir: microgateway
    main: ./cmd/mgw
    # GOFIPS140 pins the frozen, CMVP-validated module, not the toolchain's
    # latest. The fips tag is Tyk's marker for FIPS builds. Command-line
    # -tags replace the GOFLAGS ones, so the enterprise tag is repeated here.
    env:
      - GOFIPS140=v1.0.0
    flags:
      - -trimpath
      - -tags=fips{{ if eq .Env.EDITION "ent" }},enterprise{{ end }}
    ldflags:
