# Originally generated by gromit policy; now hand-maintained (edited by hand
# for the -ee edition naming and the publisher ids: filter). Do not regenerate
# it with gromit: change it here.

# Check the documentation at http://goreleaser.com
# This project needs CGO_ENABLED=1 and the cross-compiler toolchains for
# - arm64
# - amd64
version: 2
builds:
  - id: std-amd64
    ldflags:
      - -X main.Version={{.Version}}
      - -X main.BuildHash={{.FullCommit}}
      - -X main.BuildTime={{.Date}}
    goos:
      - linux
    goarch:
      - amd64
    binary: tyk-ai-studio
    hooks:
      post:
        - cmd: scripts/fips-verify.sh --edition {{ .Env.EDITION }} --std "{{ .Path }}"
  - id: std-arm64
    env:
      - CC=aarch64-linux-gnu-gcc
    ldflags:
      - -X main.Version={{.Version}}
      - -X main.BuildHash={{.FullCommit}}
      - -X main.BuildTime={{.Date}}
    goos:
      - linux
    goarch:
      - arm64
    binary: tyk-ai-studio
    hooks:
      post:
        - cmd: scripts/fips-verify.sh --edition {{ .Env.EDITION }} --std "{{ .Path }}"
  - id: std-s390x
    env:
      - CC=s390x-linux-gnu-gcc
    ldflags:
      - -X main.Version={{.Version}}
      - -X main.BuildHash={{.FullCommit}}
      - -X main.BuildTime={{.Date}}
    goos:
      - linux
    goarch:
      - s390x
    binary: tyk-ai-studio
    hooks:
      post:
        - cmd: scripts/fips-verify.sh --edition {{ .Env.EDITION }} --std "{{ .Path }}"
  - id: fips-amd64
    # GOFIPS140 pins the frozen, CMVP-validated module, not the toolchain's
    # latest. The fips tag is Tyk's marker for FIPS builds. Command-line
    # -tags replace the GOFLAGS ones, so the enterprise tag is repeated here.
    env:
      - GOFIPS140=v1.0.0
    flags:
      - -trimpath
      - -tags=fips{{ if eq .Env.EDITION "ent" }},enterprise{{ end }}
    ldflags:
      - -X main.Version={{.Version}}
      - -X main.BuildHash={{.FullCommit}}
      - -X main.BuildTime={{.Date}}
    goos:
      - linux
    goarch:
      - amd64
    binary: tyk-ai-studio
    hooks:
      post:
        - cmd: scripts/fips-verify.sh --edition {{ .Env.EDITION }} --fips "{{ .Path }}"
  - id: fips-arm64
    # GOFIPS140 pins the frozen, CMVP-validated module, not the toolchain's
    # latest. The fips tag is Tyk's marker for FIPS builds. Command-line
    # -tags replace the GOFLAGS ones, so the enterprise tag is repeated here.
    env:
      - GOFIPS140=v1.0.0
      - CC=aarch64-linux-gnu-gcc
    flags:
      - -trimpath
      - -tags=fips{{ if eq .Env.EDITION "ent" }},enterprise{{ end }}
    ldflags:
      - -X main.Version={{.Version}}
      - -X main.BuildHash={{.FullCommit}}
      - -X main.BuildTime={{.Date}}
    goos:
      - linux
    goarch:
      - arm64
    binary: tyk-ai-studio
    hooks:
      post:
        - cmd: scripts/fips-verify.sh --edition {{ .Env.EDITION }} --fips "{{ .Path }}"
  - id: fips-s390x
    # GOFIPS140 pins the frozen, CMVP-validated module, not the toolchain's
    # latest. The fips tag is Tyk's marker for FIPS builds. Command-line
    # -tags replace the GOFLAGS ones, so the enterprise tag is repeated here.
    env:
      - GOFIPS140=v1.0.0
      - CC=s390x-linux-gnu-gcc
    flags:
      - -trimpath
      - -tags=fips{{ if eq .Env.EDITION "ent" }},enterprise{{ end }}
    ldflags:
      - -X main.Version={{.Version}}
      - -X main.BuildHash={{.FullCommit}}
      - -X main.BuildTime={{.Date}}
    goos:
      - linux
    goarch:
      - s390x
    binary: tyk-ai-studio
    hooks:
      post:
        - cmd: scripts/fips-verify.sh --edition {{ .Env.EDITION }} --fips "{{ .Path }}"
nfpms:
  - id: std
    vendor: "Tyk Technologies Ltd"
    homepage: "https://tyk.io"
    maintainer: "Tyk <info@tyk.io>"
    description: Tyk AI Studio
    package_name: tyk-ai-studio{{ if eq .Env.EDITION "ent" }}-ee{{ end }}
    file_name_template: "{{ .ConventionalFileName }}"
    builds:
      - std-amd64
      - std-arm64
      - std-s390x
    formats:
      - deb
      - rpm
    contents:
      - src: "README.md"
        dst: "/opt/share/docs/tyk-ai-studio/README.md"
      - src: "ci/install/*"
        dst: "/opt/tyk-ai-studio/install"
      - src: ci/install/inits/systemd/system/tyk-ai-studio.service
        dst: /lib/systemd/system/tyk-ai-studio.service
      - src: ci/install/inits/sysv/init.d/tyk-ai-studio
        dst: /etc/init.d/tyk-ai-studio
      - src: ci/install/inits/systemd/default/tyk-ai-studio
        dst: /etc/default/tyk-ai-studio
        type: config|noreplace
      - src: ci/install/data/tyk-ai-studio.conf.example
        dst: /opt/tyk-ai-studio/tyk-ai-studio.conf.example
      - src: ci/install/data/PORTS.md
        dst: /opt/tyk-ai-studio/PORTS.md
      - src: "templates/*.tmpl"
        dst: "/opt/tyk-ai-studio/templates"
      - src: "config/docs_links.json"
        dst: "/opt/tyk-ai-studio/config/docs_links.json"
    scripts:
      preinstall: "ci/install/before_install.sh"
      postinstall: "ci/install/post_install.sh"
      postremove: "ci/install/post_remove.sh"
    bindir: "/opt/tyk-ai-studio"
    rpm:
      scripts:
        posttrans: ci/install/post_trans.sh
      signature:
        key_file: tyk.io.signing.key
    deb:
      signature:
        key_file: tyk.io.signing.key
        type: origin
  - id: fips
    vendor: "Tyk Technologies Ltd"
    homepage: "https://tyk.io"
    maintainer: "Tyk <info@tyk.io>"
    description: "Tyk AI Studio. Built with FIPS 140-3 compliant cryptography (Go Cryptographic Module v1.0.0, CMVP #5247)"
    package_name: tyk-ai-studio-fips{{ if eq .Env.EDITION "ent" }}-ee{{ end }}
    file_name_template: "{{ .ConventionalFileName }}"
    builds:
      - fips-amd64
      - fips-arm64
      - fips-s390x
    formats:
      - deb
      - rpm
    contents:
      - src: "README.md"
        dst: "/opt/share/docs/tyk-ai-studio/README.md"
      - src: "ci/install/*"
        dst: "/opt/tyk-ai-studio/install"
      - src: ci/install/inits/systemd/system/tyk-ai-studio.service
        dst: /lib/systemd/system/tyk-ai-studio.service
      - src: ci/install/inits/sysv/init.d/tyk-ai-studio
        dst: /etc/init.d/tyk-ai-studio
      - src: ci/install/inits/systemd/default/tyk-ai-studio
        dst: /etc/default/tyk-ai-studio
        type: config|noreplace
      - src: ci/install/data/tyk-ai-studio.conf.example
        dst: /opt/tyk-ai-studio/tyk-ai-studio.conf.example
      - src: ci/install/data/PORTS.md
        dst: /opt/tyk-ai-studio/PORTS.md
      - src: "templates/*.tmpl"
        dst: "/opt/tyk-ai-studio/templates"
      - src: "config/docs_links.json"
        dst: "/opt/tyk-ai-studio/config/docs_links.json"
    scripts:
      preinstall: "ci/install/before_install.sh"
      postinstall: "ci/install/post_install.sh"
      postremove: "ci/install/post_remove.sh"
    bindir: "/opt/tyk-ai-studio"
    rpm:
      scripts:
        posttrans: ci/install/post_trans.sh
      signature:
        key_file: tyk.io.signing.key
    deb:
      signature:
        key_file: tyk.io.signing.key
        type: origin
publishers:
  - name: packagecloud
    # The fips packages are published again now that their builds set
    # GOFIPS140=v1.0.0; every build's post hook (scripts/fips-verify.sh) fails
    # the release before anything is published if a binary's FIPS metadata is
    # wrong.
    ids:
      - std
      - fips
    env:
      - PACKAGECLOUD_TOKEN={{ .Env.PACKAGECLOUD_TOKEN }}
    cmd: packagecloud publish --debvers "{{ .Env.DEBVERS }}" --rpmvers "{{ .Env.RPMVERS }}" {{ .Env.PACKAGECLOUD_REPO }} {{ .ArtifactPath }}
# This disables archives
archives:
  - format: binary
    allow_different_binary_count: true
checksum:
  disable: true
release:
  disable: true
  github:
    owner: TykTechnologies
    name: tyk-ai-studio
  prerelease: auto
  draft: true
  name_template: "{{.ProjectName}}-v{{.Version}}"
