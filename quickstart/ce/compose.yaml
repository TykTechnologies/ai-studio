networks:
  tyk-network:

services:
  midsommar:
    networks:
      - tyk-network
    image: tykio/tyk-ai-studio:v2.1.0
    volumes:
      - ../confs/midsommar-ce.env:/app/.env
      - ./data/cache/plugins:/app/data/cache/plugins
      - ./data/midsommar/:/app/data/db
    env_file:
      - ../confs/midsommar-ce.env
    ports:
      - 3000:8080
      - 9595:9090
    restart: always
  mgw:
    networks:
      - tyk-network
    image: tykio/tyk-microgateway:v2.1.0
    volumes:
      - ../confs/mgw-ce.env:/app/.env
      - ../confs/mgw-analytics.yaml:/app/mgw-analytics.yaml
      - ./data/mgw:/app/data
      - ./data/cache/plugins:/data/cache/plugins
    env_file:
    - ../required.env
    - ../confs/mgw-ce.env
    ports:
      - 9091:9091
    restart: always
    depends_on:
      midsommar:
        condition: service_started
