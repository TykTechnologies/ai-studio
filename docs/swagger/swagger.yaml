      description:
        type: string
      name:
        type: string
    type: object
  api.CatalogueGroupsResponse:
    description: Teams using a catalogue
    properties:
      data:
        items:
          $ref: '#/definitions/services.CatalogueGroup'
        type: array
    type: object
  api.CatalogueInput:
    description: Catalogue input model
    properties:
      data:
        properties:
          attributes:
            properties:
              name:
                type: string
            type: object
          type:
            type: string
        type: object
