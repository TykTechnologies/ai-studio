basePath: /api/v1
definitions:
  analytics.ChartData:
    properties:
      cost:
        items:
          type: number
        type: array
      data:
        items:
          type: number
        type: array
      labels:
        items:
          type: string
        type: array
    type: object
  analytics.ModelAppUsage:
    properties:
      appDeleted:
        type: boolean
      appId:
        type: integer
      appName:
        type: string
      firstUsed:
        $ref: '#/definitions/analytics.ScanTime'
      lastUsed:
        $ref: '#/definitions/analytics.ScanTime'
      ownerEmail:
        type: string
      ownerUserId:
        type: integer
      requestCount:
        type: integer
      totalCost:
        type: number
      totalTokens:
        type: integer
    type: object
  analytics.ScanTime:
    properties:
      time.Time:
        type: string
    type: object
  api.AccessTokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: In seconds
        type: integer
      refresh_token:
        type: string
      scope:
        type: string
      token_type:
        type: string
    type: object
  api.AppDetailResponse:
    description: App detail response model
    properties:
      attributes:
        properties:
          budget_source:
            description: |-
              BudgetSource tells the portal where the budget came from: "team"
              when the App's team hands out budgets from a pool, else empty.
            type: string
          budget_start_date:
            type: string
          credential:
            $ref: '#/definitions/api.CredentialDetail'
          credential_id:
            type: integer
          datasource_ids:
            items:
              type: integer
            type: array
          description:
            type: string
          is_active:
            type: boolean
          is_orphaned:
            type: boolean
          llm_ids:
            items:
              type: integer
            type: array
          mcp_server_ids:
            description: |-
              MCPServerIDs / MCPServers mirror the list endpoint (serializeApp):
              the portal app page mounts its "MCP access" section from them.
            items:
              type: integer
            type: array
          mcp_servers:
            items:
              $ref: '#/definitions/api.AppMCPServerOutput'
            type: array
          model_router_ids:
            description: |-
              Model Routers the app is granted (Enterprise); the portal app page
              shows their unified-ingress model strings.
            items:
              type: integer
            type: array
          model_routers:
            items:
              $ref: '#/definitions/api.AppModelRouterOutput'
            type: array
          monthly_budget:
            type: number
          name:
            type: string
          semantic_router_ids:
            description: Semantic Routers the app is granted (Enterprise).
            items:
              type: integer
            type: array
          semantic_routers:
            items:
              $ref: '#/definitions/api.AppSemanticRouterOutput'
            type: array
          team_id:
            type: integer
          tool_ids:
            items:
              type: integer
            type: array
          user_id:
            type: integer
        type: object
      id:
        type: string
      type:
        type: string
    type: object
  api.AppInput:
    description: App input model
    properties:
      data:
        properties:
          attributes:
            properties:
              budget_start_date:
                type: string
              datasource_ids:
                items:
                  type: integer
                type: array
              description:
                type: string
              is_active:
                description: |-
                  IsActive is the live switch. Omitted = unchanged on update, live
                  on create (unless the caller lacks apps:publish, in which case
                  the app is created inactive). Setting it needs apps:publish.
                type: boolean
              llm_ids:
                items:
                  type: integer
                type: array
              mcp_server_ids:
                description: |-
                  MCPServerIDs binds Tyk-managed MCP servers (Enterprise). Omitted
                  leaves the bindings unchanged on update; an empty list clears them.
                items:
                  type: integer
                type: array
              metadata:
                additionalProperties: true
                type: object
              model_router_ids:
                description: |-
                  ModelRouterIDs grants Model Routers (Enterprise). Omitted leaves
                  the grants unchanged on update; an empty list clears them.
                items:
                  type: integer
                type: array
              monthly_budget:
                type: number
              name:
                type: string
              namespace:
                type: string
              plugin_resources:
                items:
                  $ref: '#/definitions/api.PluginResourceInput'
                type: array
              semantic_router_ids:
                description: |-
                  SemanticRouterIDs grants Semantic Routers (Enterprise), with
                  the same omitted/empty rules.
                items:
                  type: integer
                type: array
              team_id:
                description: |-
                  TeamID attributes the App to a team (Enterprise team budgets).
                  Omitted = the owner's budget team on create, unchanged on update.
                type: integer
              tool_ids:
                items:
                  type: integer
                type: array
              user_id:
                type: integer
            type: object
          type:
            type: string
        type: object
    type: object
  api.AppListResponse:
    description: App list response model
    properties:
      data:
        items:
          $ref: '#/definitions/api.AppResponse'
        type: array
      meta:
        properties:
          page_number:
            type: integer
          page_size:
            type: integer
          total_count:
            type: integer
          total_pages:
            type: integer
        type: object
    type: object
  api.AppMCPServerOutput:
    properties:
      auth_mode:
        type: string
      brokerable:
        type: boolean
      connection_id:
        type: integer
      endpoint_url:
        type: string
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
    type: object
  api.AppModelRouterOutput:
    properties:
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
    type: object
  api.AppResponse:
    description: App response model
    properties:
      attributes:
        properties:
          budget_start_date:
            type: string
          credential_active:
            description: |-
              CredentialActive is the state of the app's credential, null when the
              app has none, so the apps list can show it without a credentials fetch.
            type: boolean
          credential_id:
            type: integer
          datasource_ids:
            items:
              type: integer
            type: array
          description:
            type: string
          is_active:
            description: live switch (apps:publish)
            type: boolean
          is_orphaned:
            type: boolean
          llm_ids:
            items:
              type: integer
            type: array
          mcp_server_ids:
            description: Tyk-managed MCP servers bound to the app (Enterprise).
            items:
              type: integer
            type: array
          mcp_servers:
            items:
              $ref: '#/definitions/api.AppMCPServerOutput'
            type: array
          metadata:
            additionalProperties: true
            type: object
          model_router_ids:
            description: Model Routers the app is granted (Enterprise).
            items:
              type: integer
            type: array
          model_routers:
            items:
              $ref: '#/definitions/api.AppModelRouterOutput'
            type: array
          monthly_budget:
            type: number
          name:
            type: string
          namespace:
            type: string
          plugin_resources:
            items:
              $ref: '#/definitions/api.PluginResourceOutput'
            type: array
          semantic_router_ids:
            description: Semantic Routers the app is granted (Enterprise).
            items:
              type: integer
            type: array
          semantic_routers:
            items:
              $ref: '#/definitions/api.AppSemanticRouterOutput'
            type: array
          team_id:
            type: integer
          tool_ids:
            items:
              type: integer
            type: array
          user_id:
            type: integer
        type: object
      id:
        type: string
      type:
        type: string
    type: object
  api.AppSemanticRouterOutput:
    properties:
      id:
        type: integer
      models:
        items:
          type: string
        type: array
      name:
        type: string
      slug:
        type: string
    type: object
  api.AppUsageSummary:
    properties:
      app_id:
        type: string
      budget_start_date:
        type: string
      current_spend:
        type: number
      last_access_at:
        type: string
      monthly_budget:
        type: number
      percentage:
        type: number
      requests_30d:
        type: integer
    type: object
  api.AppUsageSummaryResponse:
    properties:
      data:
        additionalProperties:
          $ref: '#/definitions/api.AppUsageSummary'
        type: object
      spend_tracked:
        description: |-
          SpendTracked is false in Community Edition, where spending is not
          recorded and current_spend is always zero.
        type: boolean
    type: object
  api.AppWithTools:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      tools:
        items:
          type: string
        type: array
    type: object
  api.ApprovalRequest:
    properties:
      approved:
        type: boolean
    required:
    - approved
    type: object
  api.BrandingSettingsAttributes:
    properties:
      app_title:
        type: string
      background_color:
        type: string
      custom_css:
        type: string
      has_custom_favicon:
        type: boolean
      has_custom_logo:
        type: boolean
      primary_color:
        type: string
      secondary_color:
        type: string
    type: object
  api.BrandingSettingsResponse:
    properties:
      attributes:
        $ref: '#/definitions/api.BrandingSettingsAttributes'
      id:
        type: string
      type:
        type: string
    type: object
  api.BulkActionInput:
    description: Bulk action request
    properties:
      action:
        example: deactivate
        type: string
      ids:
        items:
          type: integer
        type: array
    type: object
  api.BulkActionResponse:
    description: Bulk action response
    properties:
      data:
        properties:
          action:
            type: string
          failed:
            type: integer
          results:
            items:
              $ref: '#/definitions/api.BulkActionResult'
            type: array
          succeeded:
            type: integer
        type: object
    type: object
  api.BulkActionResult:
    description: One object's outcome in a bulk action
    properties:
      error:
        type: string
      id:
        type: integer
      ok:
        type: boolean
    type: object
  api.CMessageListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/api.CMessageResponse'
        type: array
    type: object
  api.CMessageResponse:
    description: CMessage response model
    properties:
      attributes:
        properties:
          chat_id:
            type: integer
          content: {}
          created_at:
            type: string
          session:
            type: string
        type: object
      id:
        type: string
      type:
        type: string
    type: object
  api.CallOperationInput:
    properties:
      data:
        properties:
          attributes:
            properties:
              headers:
                additionalProperties:
                  items:
                    type: string
                  type: array
                type: object
              operation_id:
                type: string
              parameters:
                additionalProperties:
                  items:
                    type: string
                  type: array
                type: object
              payload:
                additionalProperties: true
                type: object
            type: object
          type:
            type: string
        type: object
    type: object
  api.CatalogFilterOption:
    properties:
      id:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  api.CatalogItem:
    properties:
      attributes:
        $ref: '#/definitions/api.CatalogItemAttributes'
      governed_metadata:
        description: Portal-visible governed metadata (Enterprise), display-ready.
      id:
        type: string
      type:
        type: string
    type: object
  api.CatalogItemAttributes:
    properties:
      access_granted_via_app:
        description: |-
          AccessGrantedViaApp says whether building an App is how a developer
          gets to use this item. Always true for LLM providers, data sources and
          tools; for plugin resources it is the type's resolved value with any
          per-instance override applied. When false the portal shows no
          "Build app" action.

          PortalDetailURL is the providing plugin's own page for the item, set
          whenever the type declared portal_detail_path. When access is not
          granted through an App it replaces the built-in detail page as the
          item's detail view; otherwise it is a secondary link next to
          "Build app".
        type: boolean
      allowed_models:
        items:
          type: string
        type: array
      auth_header:
        type: string
      auth_mode:
        description: |-
          MCP servers (Tyk-managed): how a client reaches the proxy and what it
          offers. Brokerable says whether an App credential can be minted for it.
        type: string
      brokerable:
        type: boolean
      catalogs:
        items:
          $ref: '#/definitions/api.CatalogRef'
        type: array
      community_submitted:
        type: boolean
      created_at:
        type: string
      default_model:
        description: LLM providers
        type: string
      embed_model:
        type: string
      embed_vendor:
        description: Data sources
        type: string
      endpoint_url:
        type: string
      endpoint_urls:
        additionalProperties:
          type: string
        type: object
      gateway_tags:
        items:
          type: string
        type: array
      kind:
        description: |-
          Kind is the type-specific sub-classification: the vendor code of an LLM
          provider, the store type of a data source, the protocol of a tool and
          "<plugin id>:<slug>" for a plugin resource. KindLabel is set when the
          backend knows a display name (plugin resource types); the UI maps the
          built-in codes itself.
        type: string
      kind_label:
        type: string
      logo_url:
        type: string
      long_description:
        type: string
      mcp_access_enabled:
        type: boolean
      mcp_endpoint_url:
        type: string
      metadata:
        additionalProperties: true
        type: object
      models:
        description: |-
          Detail responses only: the known models and the provider's metadata
          (secrets redacted, as on the admin API).
        items:
          $ref: '#/definitions/api.CatalogModelInfo'
        type: array
      name:
        type: string
      oauth:
        $ref: '#/definitions/models.MCPProtectedResourceMetadata'
      operations:
        description: |-
          Tools. A tool is served by the AI Studio gateway; the access methods say
          how an App may reach it, and each URL is present only when its method is
          switched on. A tool with neither method on is chat only and is not in
          the catalog at all.
        items:
          type: string
        type: array
      portal_detail_url:
        type: string
      primitives:
        items:
          $ref: '#/definitions/models.MCPPrimitive'
        type: array
      privacy_score:
        type: integer
      resource_type:
        allOf:
        - $ref: '#/definitions/api.CatalogResourceType'
        description: Plugin resources
      rest_access_enabled:
        type: boolean
      rest_endpoint_url:
        type: string
      router_llms:
        items:
          $ref: '#/definitions/api.CatalogRouterLLM'
        type: array
      router_models:
        items:
          type: string
        type: array
      router_routes:
        description: |-
          RouterRoutes are a Semantic Router's routes (name and description; the
          examples and keywords that pick them are configuration and stay out).
        items:
          $ref: '#/definitions/api.CatalogRouterRoute'
        type: array
      router_slug:
        description: |-
          Model Routers: the slug, the "{slug}/{model}" strings a client sends
          to the unified ingress, and (detail only) the LLMs it can route to.
        type: string
      short_description:
        type: string
      tags:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  api.CatalogItemResponse:
    properties:
      data:
        $ref: '#/definitions/api.CatalogItem'
    type: object
  api.CatalogKindFacet:
    properties:
      count:
