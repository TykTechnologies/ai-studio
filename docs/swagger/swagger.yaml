        type: object
      kinds:
        items:
          $ref: '#/definitions/api.CatalogKindFacet'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      resource_types:
        items:
          $ref: '#/definitions/api.CatalogResourceType'
        type: array
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  api.CatalogListResponse:
