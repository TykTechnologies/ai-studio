              $ref: '#/definitions/api.SimplifiedToolResponse'
            type: array
          name:
            type: string
          rag_results_per_source:
            type: integer
          supports_tools:
            type: boolean
        type: object
      id:
        type: string
      type:
        type: string
    type: object
  api.ChatHistoryRecordInput:
    description: Chat History Record input model
    properties:
