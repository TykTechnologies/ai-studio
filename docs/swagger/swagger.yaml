      input_price_per_million:
        type: number
      is_default:
        type: boolean
      name:
        type: string
      output_price_per_million:
        type: number
    type: object
  api.CatalogRef:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  api.CatalogResourceType:
    properties:
      access_granted_via_app:
        description: |-
          AccessGrantedViaApp is the type-level answer to "does an App credential
          grant access to these?"; the item carries the per-instance value.
        type: boolean
      icon:
        type: string
      name:
        type: string
      plugin_id:
        type: integer
      slug:
        type: string
    type: object
  api.CatalogRouterLLM:
    properties:
      id:
        type: string
      name:
        type: string
      vendor:
        type: string
    type: object
  api.CatalogRouterRoute:
    properties:
