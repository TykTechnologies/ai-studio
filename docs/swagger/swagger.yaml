        in: query
        name: action
        type: string
      - description: Resource type, e.g. llm
        in: query
        name: resource_type
        type: string
      - description: Resource ID
        in: query
        name: resource_id
        type: string
      - description: HTTP method
        in: query
        name: method
        type: string
      - description: Exact HTTP status
        in: query
        name: status
        type: integer
      - description: 2xx, 3xx, 4xx or 5xx
        in: query
        name: status_class
        type: string
      - description: Client IP
        in: query
        name: ip
        type: string
      - description: Request ID
        in: query
        name: req_id
        type: string
      - description: Free text over action, URL, user, resource name, IP, request
          ID
        in: query
        name: search
        type: string
      - description: Page (1-based)
        in: query
        name: page
        type: integer
      - description: Page size (max 500)
        in: query
        name: page_size
        type: integer
      - description: asc or desc
        in: query
        name: sort
        type: string
