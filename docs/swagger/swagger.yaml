        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get apps by user ID
      tags:
      - apps
  /users/{user_id}/apps/count:
    get:
      consumes:
      - application/json
      description: Get the total number of apps for a specific user
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Count apps by user ID
      tags:
      - apps
  /users/{userId}/groups:
    get:
      consumes:
      - application/json
      description: Get a list of all groups a specific user belongs to
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.GroupResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get groups for a user
      tags:
      - groups
  /vendors/embedders:
    get:
      consumes:
      - application/json
      description: Get a list of available embedders
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.VendorListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get available embedders
      tags:
      - vendors
  /vendors/llm-drivers:
    get:
      consumes:
      - application/json
      description: Get a list of available LLM drivers
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.VendorListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get available LLM drivers
      tags:
      - vendors
  /vendors/vector-stores:
    get:
      consumes:
      - application/json
      description: Get a list of available vector stores
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.VendorListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get available vector stores
      tags:
      - vendors
  /webhooks/deliveries:
    get:
      description: Page through deliveries with filters. Newest first unless sort=asc.
      parameters:
      - description: Target ID
        in: query
        name: target_id
        type: string
      - description: Exact topic
        in: query
        name: topic
        type: string
      - description: 'Comma-separated statuses: queued, in_flight, retrying, succeeded,
          dead_lettered, cancelled'
        in: query
        name: status
        type: string
      - description: Event ID
        in: query
        name: event_id
        type: string
      - description: event, test or replay
        in: query
        name: kind
        type: string
      - description: Start (YYYY-MM-DD or RFC3339)
        in: query
        name: start_date
        type: string
      - description: End (YYYY-MM-DD or RFC3339)
        in: query
        name: end_date
        type: string
      - description: Delivery or event ID (exact), or substring of target URL, topic
          or last error; bounded to the last 30 days unless start_date is given
        in: query
        name: search
        type: string
      - description: Page (1-based)
        in: query
        name: page
        type: integer
      - description: Page size (max 500)
        in: query
        name: page_size
        type: integer
      - description: asc or desc
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhooks.DeliveryPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Search the delivery log
      tags:
      - Webhooks
  /webhooks/deliveries/{id}:
    get:
      parameters:
      - description: Delivery ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhooks.DeliveryDetail'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get one delivery with its attempts, event and target
      tags:
      - Webhooks
  /webhooks/deliveries/{id}/cancel:
    post:
      parameters:
      - description: Delivery ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Cancel a queued or retrying delivery
      tags:
      - Webhooks
  /webhooks/deliveries/{id}/replay:
    post:
      consumes:
      - application/json
      description: Enqueues a new delivery of the same event to the same target. Only
        terminal deliveries can be replayed.
      parameters:
      - description: Delivery ID
        in: path
        name: id
        required: true
        type: string
      - description: Set re_render to render the payload again from the stored event
        in: body
        name: body
        schema:
          $ref: '#/definitions/api.webhookReplayInput'
      produces:
      - application/json
      responses:
        "202":
          description: delivery_id
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Replay a delivery
      tags:
      - Webhooks
  /webhooks/deliveries/export:
    get:
      description: Downloads matching deliveries (max 50,000) as CSV or JSON
      parameters:
      - description: csv (default) or json
        in: query
        name: format
        type: string
      produces:
      - text/csv
      - application/json
      responses:
        "200":
          description: file
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Export deliveries
      tags:
      - Webhooks
  /webhooks/deliveries/replay:
    post:
      consumes:
      - application/json
      description: Replays the given delivery IDs, or every dead letter for a target
        (all targets when omitted), up to max (default 100, cap 500).
      parameters:
      - description: Selection
        in: body
        name: body
        schema:
          $ref: '#/definitions/webhooks.ReplayRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhooks.ReplayResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Replay dead letters in bulk
      tags:
      - Webhooks
  /webhooks/stats:
    get:
      parameters:
      - description: 1h, 24h (default) or 7d
        in: query
        name: window
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhooks.Stats'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Delivery statistics
      tags:
      - Webhooks
  /webhooks/status:
    get:
      description: Reports whether webhooks are available (Enterprise), enabled, connected
        to the event bus, and queue depth
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhooks.Status'
      summary: Webhooks availability and health
      tags:
      - Webhooks
  /webhooks/targets:
    get:
      parameters:
      - description: pending, approved, rejected or revoked
        in: query
        name: status
        type: string
      - description: Substring over name, URL and description
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhooks.TargetList'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: List webhook targets
      tags:
      - Webhooks
    post:
      consumes:
      - application/json
      description: The target is created pending and receives nothing until an administrator
        approves it. The signing secret is returned once.
      parameters:
      - description: Target
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/webhooks.TargetInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.createWebhookTargetResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Create a webhook target (pending approval)
      tags:
      - Webhooks
  /webhooks/targets/{id}:
    delete:
      description: Cancels queued deliveries; the delivery log is kept.
      parameters:
      - description: Target ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Delete a webhook target
      tags:
      - Webhooks
    get:
      parameters:
      - description: Target ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhooks.TargetDetail'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get a webhook target with delivery statistics
      tags:
      - Webhooks
    patch:
      consumes:
      - application/json
      description: Changing the URL or custom headers of an approved target sends
        it back to pending. Send lock_version from the last read.
      parameters:
      - description: Target ID
        in: path
        name: id
        required: true
        type: string
      - description: Patch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.updateWebhookTargetInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.updateWebhookTargetResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Update a webhook target
      tags:
      - Webhooks
  /webhooks/targets/{id}/approve:
    post:
      consumes:
      - application/json
      description: Allows deliveries to the target's URL. Recorded in the audit trail.
      parameters:
      - description: Target ID
        in: path
        name: id
        required: true
        type: string
      - description: Optional note
        in: body
        name: body
        schema:
          $ref: '#/definitions/api.webhookReviewInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.WebhookTargetResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Approve a webhook target
      tags:
      - Webhooks
  /webhooks/targets/{id}/pause:
    post:
      description: Deliveries keep queueing but are not sent until resumed.
      parameters:
      - description: Target ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.WebhookTargetResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Pause deliveries to a target
      tags:
      - Webhooks
  /webhooks/targets/{id}/reject:
    post:
      consumes:
      - application/json
      parameters:
      - description: Target ID
        in: path
        name: id
        required: true
        type: string
      - description: Reason
        in: body
        name: body
        schema:
          $ref: '#/definitions/api.webhookReviewInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.WebhookTargetResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Reject a pending webhook target
      tags:
      - Webhooks
  /webhooks/targets/{id}/resume:
    post:
      parameters:
      - description: Target ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.WebhookTargetResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Resume deliveries to a paused target
      tags:
      - Webhooks
  /webhooks/targets/{id}/revoke:
    post:
      consumes:
      - application/json
      description: Stops all deliveries and cancels queued ones.
      parameters:
      - description: Target ID
        in: path
        name: id
        required: true
        type: string
      - description: Reason
        in: body
        name: body
        schema:
          $ref: '#/definitions/api.webhookReviewInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.WebhookTargetResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Revoke an approved webhook target
      tags:
      - Webhooks
  /webhooks/targets/{id}/rotate-secret:
    post:
      description: Returns the new secret once. The previous secret keeps producing
        a second signature for the configured grace period.
      parameters:
      - description: Target ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhooks.RotatedSecret'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Rotate a target's signing secret
      tags:
      - Webhooks
  /webhooks/targets/{id}/test:
    post:
      consumes:
      - application/json
      parameters:
      - description: Target ID
        in: path
        name: id
        required: true
        type: string
      - description: Optional topic for the sample event
        in: body
        name: body
        schema:
          $ref: '#/definitions/api.webhookTestInput'
      produces:
      - application/json
      responses:
        "202":
          description: delivery_id
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Send a test event to an approved target
      tags:
      - Webhooks
  /webhooks/templates/presets:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/webhooks.Preset'
            type: array
      summary: Built-in payload templates
      tags:
      - Webhooks
  /webhooks/templates/preview:
    post:
      consumes:
      - application/json
      parameters:
      - description: Template to render
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/webhooks.PreviewInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhooks.PreviewResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Render a payload template against a sample event
      tags:
      - Webhooks
  /webhooks/topics:
    get:
      description: Known system topics plus topics observed on the event bus recently
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhooks.TopicList'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Topics a target can subscribe to
      tags:
      - Webhooks
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
