midsommar:
  image:
    repository: tykio/tyk-ai-studio
    tag: v2.3.0
    pullPolicy: IfNotPresent

  # Deployment strategy. Empty (the default) means Recreate for one replica
  # and a rolling update (maxUnavailable 0, maxSurge 1) for several
  # (replicaCount > 1). Recreate stops the running pod before starting the
  # new one, so two Studio instances never run side by side during an
  # upgrade: required with SQLite (one process per database file) and the
  # supported way to run a single Studio (see the reference architecture).
  # From 2.3, several replicas on PostgreSQL can use RollingUpdate; the
  # upgrade TO 2.3 itself must still stop every older replica first (use
  # Recreate for that one upgrade, see the 2.3 upgrade notes).
  strategy: {}

  # Service configuration
  service:
    type: ClusterIP
    ports:
      - name: http
        port: 8080
        targetPort: 8080
      - name: gateway
        port: 9090
        targetPort: 9090
      - name: grpc
        port: 50051
        targetPort: 50051
        # appProtocol: grpc   # set it when a mesh or a Gateway API route in
        #                     # front needs to know the port speaks gRPC; each
        #                     # edge holds one long-lived stream on this port

  # Ingress configuration
  ingress:
    enabled: true
    certificateEnabled: true # New field to control certificate usage
    className: nginx
    certManager: # New section for cert-manager specific config
      issuer: letsencrypt-prod
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # With several replicas (replicaCount > 1) and the nginx class, the
    # Ingress pins each browser to one replica with a cookie: chat, agent
    # and MCP SSE sessions are held by the replica that started them. For
    # another ingress controller, set its own affinity annotations above.
    sessionAffinity:
      enabled: true
      cookieName: tyk-ai-studio-route
      maxAge: 172800  # seconds
    hosts:
      - host: midsommar.example.com
        paths:
          - path: /
            pathType: Prefix
            port: 8080
      - host: gateway.example.com
        paths:
          - path: /
            pathType: Prefix
            port: 9090
    tls:
      - secretName: midsommar-tls
        hosts:
          - midsommar.example.com
      - secretName: gateway-tls
        hosts:
          - gateway.example.com

  # Resources configuration
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

database:
  # Set to false to disable built-in PostgreSQL deployment
  internal: true

  # Connection details (used for both internal and external databases)
  url: "" # If set, this takes precedence over individual connection parameters
  host: ""
  port: 5432
  name: "tyk_ai_studio"
  user: "postgres"
  password: "postgres"
  # The whole DATABASE_URL from a Secret you manage (External Secrets, Sealed
  # Secrets, ...): for an external, replicated PostgreSQL give the
  # multi-host form, postgres://user:pass@pg-a,pg-b/db?target_session_attrs=read-write.
  # When set, url, host, port, name, user and password are not used.
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"

# PostgreSQL configuration
postgres:
  enabled: true # This will be tied to database.internal
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 5432

  auth:
    username: postgres
    password: postgres
    database: postgres

  # PostgreSQL persistence
  persistence:
    enabled: true
    storageClass: "" # Empty string means use default storageClass
    size: 10Gi

  # PostgreSQL resources
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Application configuration
config:
  # SMTP Configuration
  smtpServer: ""
  smtpPort: "587"
  smtpUser: "apikey"
  smtpPass: ""

  # Application Configuration
  allowRegistrations: "true"
  siteUrl: "http://localhost:8080"
  fromEmail: "noreply@example.com"
  devMode: "false"
  logLevel: "info"  # LOG_LEVEL: trace, debug, info, warn, error
  databaseType: "postgres"
  filterSignupDomains: ""
  databaseUrl: ""
  # PostgreSQL pool, readiness and start-up (see docs/site/docs/configuration.md,
  # "Postgres with a standby"). Empty keeps Studio's default; 0 is rendered.
  databaseMaxOpenConns: ""     # DATABASE_MAX_OPEN_CONNS: keep all replicas together under max_connections
  databaseMaxIdleConns: ""     # DATABASE_MAX_IDLE_CONNS (default 2)
  databaseConnMaxLifetime: ""  # DATABASE_CONN_MAX_LIFETIME (default 30m)
  databaseConnectTimeout: ""   # DATABASE_CONNECT_TIMEOUT (default 10s; lower it, e.g. 3s, for a multi-host URL)
  databaseReadyGrace: ""       # DATABASE_READY_GRACE (default 30s): /ready stays 200 through a failover shorter than this
  databaseStartupTimeout: ""   # DATABASE_STARTUP_TIMEOUT (default 60s): how long Studio waits for its database at start-up; keep probes.startup longer
  # CLUSTER_NODE_LABEL: names this release's replicas on the cluster status,
  # e.g. site-a and site-b for two releases in two clusters (default "studio").
  clusterNodeLabel: ""
  # CSRF_KEY (sensitive — stored in Secret). Required with replicaCount > 1:
  # every replica must share it. Generate with: openssl rand -hex 32
  csrfKey: ""

  # Tyk AI Configuration (sensitive — stored in Secret)
  tykAiSecretKey: ""
  tykAiLicense: ""

  # OCI Plugin / Marketplace Configuration
  ociCacheDir: "./data/cache/plugins"
  ociRequireSignature: "true"
  # Plugin deployment types AI Studio accepts: comma-separated oci, file,
  # grpc. Empty allows all; an unknown value stops startup.
  pluginAllowedSources: ""

  # Outbound network policy (LLM_UPSTREAM_BLOCK_INTERNAL): LLM upstreams,
  # guardrail providers and filter HTTP calls may not reach internal or
  # link-local addresses. On by default since 2.3. Name the in-cluster or
  # private hosts AI Studio must reach (a local Ollama, a model server) in
  # allowedInternalHosts (".svc.cluster.local" for every Service) rather than
  # turning blocking off.
  blockInternalUpstreams: "true"
  allowedInternalHosts: ""

  # Hub-Spoke: Control Plane Mode
  gatewayMode: "control"
  grpcPort: "50051"
  grpcHost: "0.0.0.0"
  grpcTlsInsecure: "true"    # Set to "false" in production with TLS
  grpcAuthToken: ""           # Sensitive — stored in Secret. Generate with: openssl rand -hex 16
  microgatewayEncryptionKey: ""  # Sensitive — stored in Secret. Generate with: openssl rand -hex 16

  # Proxy / Display URLs
  # proxyUrl auto-resolves to the microgateway k8s service if left empty.
  # Override for production with an external-facing URL (e.g. ingress hostname).
  # toolDisplayUrl and datasourceDisplayUrl fall back to proxyUrl if not set.
  proxyUrl: ""
  toolDisplayUrl: ""
  datasourceDisplayUrl: ""

# Microgateway (data plane) — deployed as a subchart
microgateway:
  enabled: true
  image:
    repository: tykio/tyk-microgateway    # Enterprise: tykio/tyk-microgateway-ent
    tag: v2.3.0
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
  config:
    controlEndpoint: ""   # Auto-resolved to "<release-name>:50051"
    edgeId: "edge-1"
    edgeNamespace: "default"
    heartbeatInterval: "30s"
    allowInsecure: "true"
    tlsEnabled: "false"
    gatewayTimeout: "300s"
    gatewayEnableFilters: "true"
    gatewayEnableAnalytics: "true"
    analyticsEnabled: "true"
    analyticsBufferSize: "1000"
    analyticsFlushInterval: "10s"
    analyticsRetentionDays: "90"
    databaseType: "sqlite"
    databaseDsn: "file:./data/edge.db?mode=rwc"
    dbAutoMigrate: "true"
    pluginsConfigPath: "/opt/tyk-microgateway/config/analytics-pulse.yaml"
    ociPluginsCacheDir: "/var/lib/microgateway/plugins"
    ociPluginsRequireSignature: "true"
    # Plugin deployment types the gateways accept (oci, file, grpc); empty allows all.
    # Each gateway enforces its own setting, whatever the hub pushes.
    pluginsAllowedSources: ""
    logLevel: "info"
  # Secrets — MUST match AI Studio config values
  secrets:
    edgeAuthToken: ""         # Must match config.grpcAuthToken
    encryptionKey: ""         # Must match config.microgatewayEncryptionKey
    tykAiLicense: ""          # Must match config.tykAiLicense

# Global configuration
global:
  # Environment name (development, staging, production)
  environment: "development"

  # Node selector for all pods
  nodeSelector: {}

  # Tolerations for all pods
  tolerations: []

  # Affinity rules for all pods
  affinity: {}

# Studio replicas. Studio is scaled by replicaCount; the chart has no
# autoscaler for it. Above 1 it needs an external PostgreSQL
# (database.internal=false), config.csrfKey, and gets a rolling update, a
# PodDisruptionBudget, spread over nodes and zones, and cookie affinity on the
# nginx Ingress. See "Several Studio replicas" in helm/README.md.
replicaCount: 1

# Pod disruption budget: rendered whenever replicaCount > 1 (minAvailable,
# default 1, or maxUnavailable when set). enabled adds one for a single
# replica too, which then blocks node drains.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Scheduling of the Studio pods. Empty topologySpreadConstraints with
# replicaCount > 1 spreads the replicas over nodes and zones (ScheduleAnyway);
# a list given here replaces that.
affinity: {}
topologySpreadConstraints: []

# Pod security context
podSecurityContext:
  fsGroup: 2000

# Container security context
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Prometheus metrics
metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s

# Configure startup, liveness and readiness probes
probes:
  # Studio answers neither /health nor /ready while it waits for its database
  # at start-up (DATABASE_STARTUP_TIMEOUT, 60s by default) and runs its
  # migrations. periodSeconds x failureThreshold (180s by default) must cover
  # that wait plus the migration time plus one more connection attempt
  # (DATABASE_CONNECT_TIMEOUT per host, twice with sslmode=prefer); raise it
  # for a large database's first start on a new version.
  startup:
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 36
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readiness:
    # true probes /ready?require=write: a replica whose database is read-only
    # leaves the Service after DATABASE_READY_GRACE. The default /ready keeps
    # it in (reads work; writes are held or answered 503).
    requireWrite: false
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

# Configure pod priority
priorityClassName: ""

# Extra environment variables
extraEnv:
  []
  # - name: EXTRA_VAR
  #   value: "extra-value"

# Extra volumes and volume mounts
extraVolumes: []
extraVolumeMounts: []

# Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""
