{{- if and .Values.enabled (not .Values.secrets.existingSecret) }}
{{/*
Skipped entirely when secrets.existingSecret is set, so the values file need
never hold plaintext credentials — point it at a Secret managed by External
Secrets, Sealed Secrets, or your own tooling. The keys it must carry are
EDGE_AUTH_TOKEN, ENCRYPTION_KEY and TYK_AI_LICENSE; they are consumed via
envFrom, so the key names must match exactly.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "microgateway.fullname" . }}-secrets
  labels:
    {{- include "microgateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.edgeAuthToken }}
  EDGE_AUTH_TOKEN: {{ .Values.secrets.edgeAuthToken | quote }}
  {{- end }}
  {{- if .Values.secrets.encryptionKey }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  {{- end }}
  {{- if .Values.secrets.tykAiLicense }}
  TYK_AI_LICENSE: {{ .Values.secrets.tykAiLicense | quote }}
  {{- end }}
{{- end }}
