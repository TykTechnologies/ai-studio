{{- if and .Values.enabled .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "microgateway.serviceAccountName" . }}
  labels:
    {{- include "microgateway.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The gateway reads no Kubernetes API objects — its configuration arrives over
# the hub-spoke gRPC stream — so it needs no RBAC and no mounted token.
automountServiceAccountToken: false
{{- end }}
