{{- include "midsommar.validateReplicas" . }}
{{- include "midsommar.validateEdge" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "midsommar.fullname" . }}
spec:
  replicas: {{ int .Values.replicaCount }}
  {{- include "midsommar.strategy" . | trim | nindent 2 }}
  selector:
    matchLabels:
      {{- include "midsommar.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        date: "{{ now | unixEpoch }}"
        {{- include "midsommar.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* affinity wins over global.affinity */}}
      {{- with (default .Values.global.affinity .Values.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- else if gt (int .Values.replicaCount) 1 }}
      {{- /* Several replicas: spread them over nodes, and over zones where
             the nodes carry one, so one node or zone does not take them all. */}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "midsommar.selectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "midsommar.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- /* preStop delay + Studio's shutdown (up to 30 s: it stops accepting
             connections and lets requests in flight finish) + a margin. */}}
      terminationGracePeriodSeconds: {{ include "midsommar.terminationGracePeriod" . }}
      containers:
        - name: midsommar
          image: "{{ .Values.midsommar.image.repository }}:{{ .Values.midsommar.image.tag }}"
          imagePullPolicy: {{ .Values.midsommar.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: gateway
              containerPort: 9090
              protocol: TCP
          env:
            - name: DATABASE_TYPE
              value: {{ .Values.config.databaseType }}
            {{- if .Values.database.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ default "DATABASE_URL" .Values.database.existingSecretKey }}
            {{- else }}
            - name: DATABASE_URL
              value: {{ default (printf "postgres://%s:%s@%s:%v/%s"
                (required "database.user is required" .Values.database.user)
                (required "database.password is required" .Values.database.password)
                (default (printf "%s-postgres" (include "midsommar.fullname" .)) .Values.database.host)
                (default 5432 .Values.database.port)
                (default "midsommar" .Values.database.name))
                .Values.database.url }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "midsommar.fullname" . }}-config
            - secretRef:
                name: {{ include "midsommar.fullname" . }}-secrets
          {{- with (include "midsommar.preStopDelay" . | int) }}
          {{- /* Keep serving for a moment after Kubernetes starts removing
                 the pod from the Service's endpoints, which takes a few
                 seconds to reach every node: requests already routed to it
                 are answered instead of refused. The sleep action needs no
                 shell, so it works with the distroless images. */}}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ . }}
          {{- end }}
          {{- /* Studio answers neither /health nor /ready while it waits for its
                 database at start-up (DATABASE_STARTUP_TIMEOUT) and runs its
                 migrations: the startup probe covers that time, and liveness
                 and readiness start after it. */}}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            successThreshold: {{ .Values.probes.liveness.successThreshold }}
          readinessProbe:
            httpGet:
              path: {{ ternary "/ready?require=write" "/ready" (eq (toString .Values.probes.readiness.requireWrite) "true") }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.probes.readiness.successThreshold }}
          volumeMounts:
            - name: data
              mountPath: /opt/tyk-ai-studio/data
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.midsommar.resources }}
          resources:
            {{- toYaml .Values.midsommar.resources | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- if .Values.database.internal }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "midsommar.fullname" . }}-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ .Values.database.user }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.database.password }}
            - name: POSTGRES_DB
              value: {{ .Values.database.name }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.database.user }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.database.user }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- if .Values.postgres.resources }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          {{- end }}
          {{- if .Values.postgres.persistence.enabled }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          {{- end }}
      {{- if .Values.postgres.persistence.enabled }}
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ include "midsommar.fullname" . }}-postgres-pvc
      {{- end }}
{{- end }}
