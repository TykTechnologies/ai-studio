name: s7-soak
title: "S7 · One-hour soak at 70% of capacity"
description: >
  Constant Poisson load for an hour at about 70% of the S4 capacity. A healthy
  gateway shows flat p99 latency across the 5-minute windows, a stable goroutine
  count, bounded memory, no errors, and analytics for every request. Growth in
  any of them is a leak or a queue that does not drain. The rate below assumes a
  knee of about 200 req/s. Scale it from your S4 result:
  --rate-scale <sustained_rps / 200>.
mode: open
baseline: direct
timeout: 60s
quick_scale: 0.05
open:
  arrival: poisson
  rate: {kind: constant, rps: 140, duration: 60m}
  warmup: 30s
  report_window: 5m
  max_in_flight: 30000
  max_lag_ms: 5
cells:
  - name: stream-realistic
    body: {format: openai, stream: true, model: mock-model, prompt_bytes: 2048, max_tokens: 200}
    arms:
      - {name: gateway, target: gateway, path: /llm/call/mock-realistic/v1/chat/completions, weight: 1}
      - {name: direct, target: mock, path: "{mock:realistic}/v1/chat/completions", weight: 0.1}
