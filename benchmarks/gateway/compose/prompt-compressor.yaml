# Overlay for the Prompt Compressor scenarios (s8-*): mounts a Linux build
# of the plugin into Studio and the edge at /opt/plugins (a safe plugin
# directory), so `gwbench seed -compressor file:///opt/plugins/prompt-compressor`
# can register it. Build the binary for the Docker host's architecture:
#
#   cd community/plugins/prompt-compressor
#   GOOS=linux GOARCH=arm64 CGO_ENABLED=0 GOWORK=off go build -o <dir>/prompt-compressor .
#
# then pass the directory as PC_PLUGIN_DIR (see README, Prompt Compressor).
services:
  studio:
    volumes:
      - ${PC_PLUGIN_DIR:?set PC_PLUGIN_DIR to the directory holding the prompt-compressor binary}:/opt/plugins:ro
  gateway:
    volumes:
      - ${PC_PLUGIN_DIR:?set PC_PLUGIN_DIR to the directory holding the prompt-compressor binary}:/opt/plugins:ro
