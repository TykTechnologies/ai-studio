# golangci-lint v2 configuration (https://golangci-lint.run/docs/configuration/file/).
# Validate with: golangci-lint config verify
version: "2"

run:
  timeout: 10m
  build-tags: []

linters:
  enable:
    - bodyclose
    - dupl
    - errcheck
    - gocritic
    - govet
    - gosec
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - whitespace

  settings:
    dupl:
      # tokens count to trigger issue, 150 by default
      threshold: 100

    errcheck:
      # Report about assignment of errors to blank identifier: `num, _ := strconv.Atoi(numStr)`.
      check-blank: true

      # Report about not checking of errors in type assertions: `a := b.(MyStruct)`.
      check-type-assertions: true

    gocritic:
      # See https://go-critic.github.io/overview#checks-overview
      # To check which checks are enabled run `GL_DEBUG=gocritic golangci-lint run`
      enabled-tags:
        - performance

    govet:
      # enable-all includes the shadow analyzer (v1's check-shadowing).
      enable-all: true

    lll:
      # Max line length; lines longer will be reported
      # '\t' is counted as 1 character by default, and can be changed with the 'tab-width' option
      line-length: 120
      # Tab width in spaces
      tab-width: 2

    misspell:
      # Correct spellings using locale preferences for US or UK.
      # Default is to use a neutral variety of English.
      # Setting locale to US will correct the British spelling of 'colour' to 'color'.

      # Intentionally leaving this unset as most engineering terminology skews US however Tyk standard is UK.
      #locale: UK

      ignore-rules: []

    staticcheck:
      # https://staticcheck.dev/docs/configuration/options/#checks
      # The Go version is taken from go.mod.
      checks: ["all"]

    whitespace:
      multi-if: false # Enforces newlines (or comments) after every multi-line if statement
      multi-func: false # Enforces newlines (or comments) after every multi-line function signature

  exclusions:
    generated: lax
    # v1's default exclusions, kept so the migration to v2 does not change the findings.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

    # third_party/gorm.io is upstream gorm, rebuilt by scripts/gorm-vendor.sh and
    # never edited by hand; third_party/langchaingo is Tyk's langchaingo fork,
    # kept in upstream style (see third_party/README.md). examples$ and builtin$
    # were excluded by v1's default directory exclusions.
    paths:
      - third_party
      - builtin$
      - examples$

    # Excluding configuration per-path, per-linter, per-text and per-source
    rules:
      # Exclude some linters from running on test files.
      - path: _test\.go
        linters:
          - dupl
      # v2 needs a second condition besides text on each rule.
      - linters:
          - revive
        text: "^exported: exported var Err[A-Za-z0-9]+ should have comment or be unexported$"
      - linters:
          - govet
        text: "shadow: declaration of .err. shadows declaration"

# gofmt, gofumpt and goimports are formatters in v2, no longer linters.
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports

  settings:
    gofmt:
      # Simplify code with '-s' option
      simplify: true

    gofumpt:
      # Extra rules that are disabled by default (v1's extra-rules)
      extra:
        group-params: true

  exclusions:
    generated: lax
    paths:
      - third_party
      - builtin$
      - examples$

issues:
  # Show only new issues created since branching away from the default branch on the remote
  new-from-rev: origin/main
