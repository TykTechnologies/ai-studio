# Tyk AI Studio - Full Development Environment
#
# This compose file extends the minimal setup with:
#   - Microgateway (edge proxy, rebuild on container restart)
#   - Plugin watcher (auto-rebuilds plugins on change)
#
# Usage:
#   cd dev && docker compose -f docker-compose.yml -f docker-compose.full.yml up --build
#   Or use: make dev-full (from project root)
#
# Additional Services:
#   - gateway:  Microgateway in edge mode (port 8081)
#   - plugins:  Plugin watcher and builder

services:
  # Studio - mount plugin builds volume
  studio:
    volumes:
      - plugin_builds:/app/bin/plugins

  # Microgateway - Edge Proxy (rebuild on container restart)
  gateway:
    build:
      context: ..
      dockerfile: dev/Dockerfile.studio
      args:
        EDITION: ${EDITION:-ce}
    container_name: midsommar-gateway
    command: >
      sh -c '
        echo "Building Microgateway...";
        mkdir -p /app/tmp/gateway;
        if [ "$$EDITION" = "ent" ] && [ -d /app/enterprise ]; then
          echo "Building Microgateway (Enterprise)...";
          cd /app/microgateway && CGO_ENABLED=1 go build -tags enterprise -o /app/tmp/gateway/microgateway ./cmd/microgateway || exit 1;
        else
          echo "Building Microgateway (Community)...";
          cd /app/microgateway && CGO_ENABLED=1 go build -o /app/tmp/gateway/microgateway ./cmd/microgateway || exit 1;
        fi;
        echo "Starting Microgateway...";
        exec /app/tmp/gateway/microgateway -env=/app/dev/.env.gateway
      '
    volumes:
      # Mount source code
      - ..:/app
      # Separate tmp directory for gateway builds
      - gateway_tmp:/app/tmp/gateway
      # Share Go module cache
      - go_cache:/root/go/pkg/mod
      # Gateway data directory
      - gateway_data:/app/data/gateway
      # Built plugins from plugin watcher
      - plugin_builds:/app/bin/plugins
    ports:
      - "8081:8080"   # Gateway HTTP API (mapped to 8081 to avoid conflict)
    env_file:
      - .env.gateway
    environment:
      # Override/supplement env file settings
      EDITION: ${EDITION:-ce}
      # Docker Compose specific - override control endpoint to use service name
      CONTROL_ENDPOINT: studio:50051
      # Use shared auth token from main .env
      EDGE_AUTH_TOKEN: ${GRPC_AUTH_TOKEN:-dev-grpc-auth-token-change-in-production}
      ENCRYPTION_KEY: ${MICROGATEWAY_ENCRYPTION_KEY:-dev-encryption-key-change-in-production}
      # License from main .env (if enterprise)
      TYK_AI_LICENSE: ${TYK_AI_LICENSE:-}
      OCI_PLUGINS_REGISTRY_DOCKER_TYK_IO_ENTITLEMENT: ${OCI_PLUGINS_REGISTRY_DOCKER_TYK_IO_ENTITLEMENT:-}
      OCI_PLUGINS_CACHE_DIR: /app/oci-cache
    depends_on:
      studio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - midsommar-dev

  # Plugin Builder - watches and rebuilds plugins on change
  #
  # Gated behind the "plugins" profile: building every plugin module on start
  # costs minutes, and the rest of the stack does not depend on it. Started by
  # the *-plugins make targets, or with --profile plugins.
  plugins:
    profiles: ["plugins"]
    image: golang:1.25-alpine
    container_name: midsommar-plugins
    working_dir: /app
    command: >
      sh -c "
        apk add --no-cache inotify-tools gcc musl-dev make git findutils;
        echo '========================================';
        echo 'Plugin Watcher Started';
        echo '========================================';
        echo 'Watching plugin directories:';
        echo '  - examples/plugins/';
        echo '  - community/plugins/ (if present)';
        echo '  - enterprise/plugins/ (if present)';
        echo '  - tyk-internal/plugins/ (if present)';
        echo '';

        # Build a single plugin given its go.mod directory
        build_one_plugin() {
          plugin_dir=\"\$$1\";
          plugin_name=\$$(basename \"\$$plugin_dir\");
          if [ \"\$$plugin_name\" = 'server' ]; then
            plugin_name=\$$(basename \$$(dirname \"\$$plugin_dir\"));
          fi;
          if echo \"\$$plugin_dir\" | grep -q 'enterprise/'; then
            build_tags='-tags enterprise';
          else
            build_tags='';
          fi;
          echo \"Building: \$$plugin_name\";
          mkdir -p /app/bin/plugins;
          (cd \"\$$plugin_dir\" && CGO_ENABLED=0 go build \$$build_tags -o /app/bin/plugins/\$$plugin_name .) && echo \"  ✓ \$$plugin_name\" || echo \"  ✗ \$$plugin_name\";
        };

        build_all_plugins() {
          echo 'Building all plugins...';
          for plugin_root in examples/plugins community/plugins enterprise/plugins tyk-internal/plugins; do
            if [ -d \"\$$plugin_root\" ]; then
              echo \"Scanning \$$plugin_root...\";
              find \"\$$plugin_root\" -name 'go.mod' 2>/dev/null | while read modfile; do
                build_one_plugin \$$(dirname \"\$$modfile\");
              done;
            fi;
          done;
          echo '✅ Plugin build complete';
        };

        # Find the nearest go.mod ancestor for a changed file
        find_plugin_dir() {
          dir=\"\$$1\";
          while [ \"\$$dir\" != '.' ] && [ \"\$$dir\" != '/' ]; do
            if [ -f \"\$$dir/go.mod\" ]; then
              echo \"\$$dir\";
              return 0;
            fi;
            dir=\$$(dirname \"\$$dir\");
          done;
          return 1;
        };

        # Initial build of all plugins
        echo 'Performing initial plugin build...';
        build_all_plugins;
        echo '';

        # Build watch paths - only include directories that exist
        watch_paths='';
        [ -d /app/examples/plugins ] && watch_paths=\"\$$watch_paths /app/examples/plugins\";
        [ -d /app/community/plugins ] && watch_paths=\"\$$watch_paths /app/community/plugins\";
        [ -d /app/enterprise/plugins ] && watch_paths=\"\$$watch_paths /app/enterprise/plugins\";
        [ -d /app/tyk-internal/plugins ] && watch_paths=\"\$$watch_paths /app/tyk-internal/plugins\";

        # Watch for changes and rebuild only the affected plugin
        # Uses monitor mode (-m) to get the changed file path
        last_built='';
        last_built_time=0;
        echo \"Watching for changes in:\$$watch_paths\";
        inotifywait -r -m -e modify,create,delete,move --format '%w%f' \$$watch_paths 2>/dev/null | while read changed_file; do
          # Skip non-Go/mod files to avoid unnecessary rebuilds
          case \"\$$changed_file\" in
            *.go|*/go.mod|*/go.sum) ;;
            *) continue ;;
          esac;
          # Strip /app/ prefix to get relative path
          rel_path=\$$(echo \"\$$changed_file\" | sed 's|^/app/||');
          plugin_dir=\$$(find_plugin_dir \"\$$rel_path\");
          if [ -n \"\$$plugin_dir\" ]; then
            # Simple debounce: skip if same plugin rebuilt within last 2 seconds
            now=\$$(date +%s);
            if [ \"\$$plugin_dir\" = \"\$$last_built\" ] && [ \$$(( now - last_built_time )) -lt 2 ]; then
              continue;
            fi;
            last_built=\"\$$plugin_dir\";
            last_built_time=\$$now;
            echo '';
            echo \">>> Change detected in \$$rel_path\";
            build_one_plugin \"\$$plugin_dir\";
            echo '';
          fi;
        done
      "
    volumes:
      # Mount source code
      - ..:/app
      # Share Go module cache
      - go_cache:/root/go/pkg/mod
      # Plugin output directory
      - plugin_builds:/app/bin/plugins
    environment:
      CGO_ENABLED: "1"
      EDITION: ${EDITION:-ce}
    networks:
      - midsommar-dev

volumes:
  gateway_tmp:
    name: midsommar-gateway-tmp
  gateway_data:
    name: midsommar-gateway-data
  plugin_builds:
    name: midsommar-plugin-builds
