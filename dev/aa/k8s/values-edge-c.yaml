# Values for helm/charts/microgateway: a third, small edge (release edge-c) in
# edge namespace "nsb", for the Enterprise pass's cross-namespace check (a key
# change in namespace default must not make this edge sync). It carries no
# load: a few requests by hand. On a zone-a tools node, which has room.
kind: StatefulSet
replicaCount: 1
image:
  repository: MICROGATEWAY_REPOSITORY
  tag: MICROGATEWAY_TAG
persistence:
  enabled: true
  storageClass: gp3
  size: 5Gi
nodeSelector:
  aa-load/role: tools
  topology.kubernetes.io/zone: eu-west-3a
tolerations:
  - {key: aa-load, operator: Equal, value: tools, effect: NoSchedule}
resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {cpu: "1", memory: 1Gi}
config:
  controlEndpoints: ["cp-b:50051", "cp-a:50051"]   # own site first
  controlFailbackInterval: ""
  startFromLastKnownGood: true
  # EDGE_CREDENTIAL_SYNC: "full" for the Enterprise pass (AA_CREDENTIAL_SYNC
  # at render-edges); empty is the default (keys validated on demand).
  credentialSync: "CREDENTIAL_SYNC"
  edgeNamespace: nsb
  heartbeatInterval: "5s"
  # The image's working directory is not the chart's: name the volume.
  databaseDsn: "file:/opt/tyk-microgateway/data/edge.db?mode=rwc"
  # The mock upstream has a cluster-internal address.
  blockInternalUpstreams: false
secrets:
  existingSecret: aa-edge   # EDGE_AUTH_TOKEN, ENCRYPTION_KEY; created by aa-k8s.sh secrets
extraEnv:
  - {name: GATEWAY_SERVER_TIMING, value: "true"}
  # Enterprise images only; the Secret is created by aa-k8s.sh license.
  - name: TYK_AI_LICENSE
    valueFrom: {secretKeyRef: {name: aa-license, key: TYK_AI_LICENSE, optional: true}}
analyticsPulse:   # as benchmarks/gateway/compose/analytics-pulse.yaml
  includeRequestResponseData: false
  excludedVendors: []
