# One load run: a k6 Job on the load node. aa-k8s.sh creates it from this
# template with the run's name and settings, and the script from load.js as
# the ConfigMap aa-load-script. Results are the pod's log (a JSON line per
# failed request, then k6's summary).
apiVersion: batch/v1
kind: Job
metadata:
  name: RUN_NAME
  namespace: aa-load
  labels: {app: aa-load}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {app: aa-load, run: RUN_NAME}}
    spec:
      restartPolicy: Never
      nodeSelector: {aa-role: load}
      containers:
        - name: k6
          image: grafana/k6:0.57.0
          args: ["run", "--quiet", "/scripts/load.js"]
          env:
            - {name: DURATION, value: "RUN_DURATION"}
            - {name: EDGE_RPS, value: "RUN_EDGE_RPS"}
            - {name: WRITE_RPS, value: "RUN_WRITE_RPS"}
            - {name: LOGIN_RPS, value: "RUN_LOGIN_RPS"}
            - name: APP_KEY
              valueFrom: {secretKeyRef: {name: aa-load, key: APP_KEY}}
            - name: PROBE_PASSWORD
              valueFrom: {secretKeyRef: {name: aa-load, key: PROBE_PASSWORD}}
          resources:
            requests: {cpu: "2", memory: 1Gi}
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts: [{name: script, mountPath: /scripts}]
      volumes:
        - name: script
          configMap: {name: aa-load-script}
