# PostgreSQL primary and synchronous hot standby, one per site, each on its
# site's hub node (with that site's Studio, as in the gateway benchmark's hub).
# The entrypoint script is the ConfigMap aa-pg-node, created by aa-k8s.sh
# from pg-node-k8s.sh; the password is in the Secret aa-shared.
apiVersion: v1
kind: Service
metadata: {name: pg-a, namespace: aa-load}
spec:
  clusterIP: None
  publishNotReadyAddresses: true # the standby copies from a primary that is not Ready yet
  selector: {app: pg, node: pg-a}
  ports: [{name: pg, port: 5432}]
---
apiVersion: v1
kind: Service
metadata: {name: pg-b, namespace: aa-load}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: pg, node: pg-b}
  ports: [{name: pg, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: pg-a, namespace: aa-load}
spec:
  serviceName: pg-a
  replicas: 1
  selector: {matchLabels: {app: pg, node: pg-a}}
  template:
    metadata: {labels: {app: pg, node: pg-a, site: a}}
    spec:
      nodeSelector: {aa-load/role: hub, aa-load/site: a}
      tolerations: [{key: aa-load, operator: Equal, value: hub, effect: NoSchedule}]
      terminationGracePeriodSeconds: 30
      securityContext: {runAsUser: 70, runAsGroup: 70, fsGroup: 70}
      containers:
        - name: postgres
          image: postgres:16-alpine
          command: ["/aa/pg-node-k8s.sh"]
          env:
            - {name: AA_NODE, value: pg-a}
            - {name: AA_PEER, value: pg-b}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_DB, value: midsommar}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: aa-shared, key: POSTGRES_PASSWORD}}
          ports: [{name: pg, containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres", "-q"]}
            periodSeconds: 3
          resources:
            requests: {cpu: "1500m", memory: 4Gi}
            limits: {cpu: "1500m", memory: 4Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: script, mountPath: /aa}
            - {name: roles, mountPath: /aa-roles}
      volumes:
        - name: script
          configMap: {name: aa-pg-node, defaultMode: 0555}
        - name: roles
          configMap: {name: aa-pg-roles}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3
        resources: {requests: {storage: 50Gi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: pg-b, namespace: aa-load}
spec:
  serviceName: pg-b
  replicas: 1
  selector: {matchLabels: {app: pg, node: pg-b}}
  template:
    metadata: {labels: {app: pg, node: pg-b, site: b}}
    spec:
      nodeSelector: {aa-load/role: hub, aa-load/site: b}
      tolerations: [{key: aa-load, operator: Equal, value: hub, effect: NoSchedule}]
      terminationGracePeriodSeconds: 30
      securityContext: {runAsUser: 70, runAsGroup: 70, fsGroup: 70}
      containers:
        - name: postgres
          image: postgres:16-alpine
          command: ["/aa/pg-node-k8s.sh"]
          env:
            - {name: AA_NODE, value: pg-b}
            - {name: AA_PEER, value: pg-a}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_DB, value: midsommar}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: aa-shared, key: POSTGRES_PASSWORD}}
          ports: [{name: pg, containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres", "-q"]}
            periodSeconds: 3
          resources:
            requests: {cpu: "1500m", memory: 4Gi}
            limits: {cpu: "1500m", memory: 4Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: script, mountPath: /aa}
            - {name: roles, mountPath: /aa-roles}
      volumes:
        - name: script
          configMap: {name: aa-pg-node, defaultMode: 0555}
        - name: roles
          configMap: {name: aa-pg-roles}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3
        resources: {requests: {storage: 50Gi}}
