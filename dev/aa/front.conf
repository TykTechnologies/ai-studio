# Front proxy of the two-site dev stack: one address for the UI and API of
# both control planes. ip_hash keeps a client on one replica (the UI needs
# session affinity); a replica that stops answering is skipped.
upstream studio {
    ip_hash;
    server studio-a:8080 max_fails=1 fail_timeout=5s;
    server studio-b:8080 max_fails=1 fail_timeout=5s;
}

server {
    listen 8080;
    client_max_body_size 50m;

    location / {
        proxy_pass http://studio;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_connect_timeout 2s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_next_upstream error timeout;
    }
}
