name: Release Gate

# The full test suite, cold: every test re-runs, nothing is skipped by path,
# and the suites too slow or heavy for pull requests run too (UI E2E, the
# enterprise plugins' unit, integration and E2E tests).
#
# - release.yml runs it before anything is published, unless a passing run
#   already exists for the tagged commit.
# - Run it by hand on main before cutting a release candidate (Actions >
#   Release Gate > Run workflow); tagging that commit afterwards reuses the
#   result and the release starts at once.
# - It runs nightly on main, as the cold check behind the cached pull
#   request runs (see ci-test.yml).

on:
  workflow_call:
    inputs:
      include_fips_smoke:
        description: "Build the ENT packages and run the FIPS 140-3 smoke test of the -fips images and packages (release.yml sets it)"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      include_package_smoke:
        description: "Also build the ENT .deb/.rpm packages and smoke-test them, with the FIPS 140-3 images and packages (about 50 minutes)"
        type: boolean
        default: false
      include_fips_smoke:
        description: "Build the ENT packages and run only the FIPS 140-3 smoke test of the -fips images and packages (included in the package smoke)"
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

env:
  # Only the enterprise module is private; every other TykTechnologies module
  # (tyk-identity-broker, storage, ...) is public and comes through the proxy.
  GOPRIVATE: github.com/TykTechnologies/ai-studio-enterprise

jobs:
  # Every job of the pull request workflow, in full mode: -count=1,
  # coverage, both editions, the enterprise module and the Postgres suites.
  core:
    name: Core
    uses: ./.github/workflows/ci-test.yml
    with:
      mode: full
    secrets: inherit

  ui-e2e:
    name: UI
    uses: ./.github/workflows/ui-tests.yml
    secrets: inherit

  # The enterprise plugins are Go modules of their own, which no other
  # workflow tests. Their go.sum files are not committed (enterprise
  # .gitignore), so -mod=mod lets Go write them.
  enterprise-plugins:
    name: Enterprise Plugin Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOWORK: "off"
      GOFLAGS: -mod=mod
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
          token: ${{ secrets.CI_SUBMODULE_PAT }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Create placeholders for embeds
        run: |
          mkdir -p docs/site/dist ui/admin-frontend/build
          echo "placeholder" > docs/site/dist/index.html
          echo "placeholder" > ui/admin-frontend/build/index.html

      - name: Unit tests
        run: |
          failed=""
          for mod in $(find enterprise/plugins -name go.mod -not -path '*/node_modules/*' | sort); do
            dir=$(dirname "$mod")
            echo "::group::$dir"
            (cd "$dir" && go test -tags enterprise -v -race -count=1 ./...) || failed="$failed $dir"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Plugin unit tests failed in:$failed"
            exit 1
          fi

      # Docker: Redis and the other backing services start in containers.
      - name: Integration tests
        run: make test-plugins-integration TEST_EDITION=ent TEST_TIMEOUT=30m

      - name: E2E tests
        run: make test-plugins-e2e TEST_EDITION=ent TEST_TIMEOUT=30m

  # goreleaser builds the ENT packages in Docker, and Playwright checks the
  # installed result. release.yml builds the same packages, so this only runs
  # when asked for.
  # include_fips_smoke (every tagged release: release.yml sets it) runs only
  # the FIPS 140-3 smoke test (tests/fipssmoke: self-report, TLS posture,
  # hub-edge sync, a proxied call) of the -fips images and .debs; the full
  # package smoke includes it. release.yml reuses a passing gate run only if
  # this job passed in it.
  package-smoke:
    name: Package Smoke Tests (ENT)
    if: inputs.include_package_smoke == true || inputs.include_fips_smoke == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
          token: ${{ secrets.CI_SUBMODULE_PAT }}
          # The submodules are fetched here; nothing later needs git
          # credentials, so the npm install scripts below cannot read the PAT.
          persist-credentials: false

      # The FIPS images build on tykio/dhi-busybox (Docker Hardened Images),
      # which is private: pull it with the Docker Hub credentials release.yml
      # uses, then log out at once, before any npm install script runs. The
      # image builds later find it in the local image store. This job runs
      # only on release.yml's call and on manual dispatch, where the secrets
      # exist; a missing secret fails here, by name.
      - name: Check the Docker Hub credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error::DOCKER_USERNAME and DOCKER_PASSWORD are needed to pull the private FIPS base image (tykio/dhi-busybox)"
            exit 1
          fi

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull the FIPS base image
        run: |
          base=$(awk '$1 == "FROM" && $2 ~ /^tykio\/dhi-busybox:/ { print $2; exit }' ci/Dockerfile.fips.distroless)
          trap 'docker logout' EXIT # also when the pull fails
          [ -n "$base" ] || { echo "::error::no tykio/dhi-busybox base in ci/Dockerfile.fips.distroless"; exit 1; }
          docker pull "$base"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Pre-fetch Go modules
        # The goreleaser container mounts the host module cache and has no
        # credentials of its own.
        run: |
          mkdir -p ~/go/pkg/mod ~/.cache/go-build
          go mod download
          (cd microgateway && go mod download)

      # make package-ent builds the admin UI (make build-frontend runs
      # npm run build) but does not install its dependencies; install them
      # as release.yml's Build UI step does.
      - name: Install admin UI dependencies
        working-directory: ui/admin-frontend
        run: |
          npm ci --ignore-scripts
          npm rebuild

      # CI=false: GitHub sets CI=true, under which the UI build fails on lint
      # warnings (release.yml builds the UI with CI=false too).
      - name: Build packages and run smoke tests
        if: inputs.include_package_smoke == true
        env:
          TYK_AI_LICENSE: ${{ secrets.TYK_AI_LICENSE }}
          CI: "false"
        run: make test-package-smoke-ent

      - name: Build packages and run the FIPS smoke test
        if: inputs.include_package_smoke != true
        env:
          TYK_AI_LICENSE: ${{ secrets.TYK_AI_LICENSE }}
          CI: "false"
        run: make package-ent test-fips-smoke

      # goreleaser's post hooks already ran scripts/fips-verify.sh on every
      # binary; this re-checks what is left in dist/ (the microgateway build).
      - name: Verify FIPS build metadata
        run: scripts/fips-verify.sh --edition ent --dist dist

  gate:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [core, ui-e2e, enterprise-plugins, package-smoke]
    if: always()
    steps:
      - name: Summary
        env:
          RESULTS: |
            Core (both editions, full)=${{ needs.core.result }}
            UI E2E=${{ needs.ui-e2e.result }}
            Enterprise plugins=${{ needs.enterprise-plugins.result }}
            Package smoke=${{ needs.package-smoke.result }}
        run: |
          {
            echo "# Release Gate"
            echo ""
            echo "| Suite | Status |"
            echo "|-------|--------|"
            while IFS='=' read -r suite result; do
              [ -n "$suite" ] || continue
              case "$result" in
                success) icon=':white_check_mark:' ;;
                skipped) icon=':fast_forward: skipped' ;;
                *) icon=":x: $result" ;;
              esac
              echo "| $suite | $icon |"
            done <<< "$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"

      # Every suite must pass; only the opt-in package smoke may be skipped.
      - name: Check Results
        if: >-
          needs.core.result != 'success' ||
          needs.ui-e2e.result != 'success' ||
          needs.enterprise-plugins.result != 'success' ||
          !contains(fromJSON('["success","skipped"]'), needs.package-smoke.result)
        run: |
          echo "The release gate failed."
          exit 1
