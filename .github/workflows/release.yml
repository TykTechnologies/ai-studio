# yamllint disable rule:line-length rule:truthy
name: Release
# Based on gromit policy, extended for component/edition matrix

# Distribution channels covered by this workflow
# - Ubuntu and Debian (DEB)
# - RHEL and AL (RPM)
# - Docker Hub
# - Cloudsmith
on:
  push:
    tags:
      - "v*"

defaults:
  run:
    working-directory: midsommar

env:
  GOPRIVATE: github.com/TykTechnologies
  VARIATION: inverted
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false
  BASE_REF: ${{startsWith(github.event_name, 'pull_request') && github.base_ref || github.ref_name}}
jobs:
  goreleaser:
    name: "${{ matrix.component }}-${{ matrix.edition }}"
    runs-on: ubuntu-latest
    permissions:
      id-token: write # AWS OIDC JWT
      contents: read # actions/checkout
    strategy:
      fail-fast: false
      matrix:
        component: [studio, microgateway]
        edition: [ce, ent]
        include:
          # Studio CE
          - component: studio
            edition: ce
            golang_cross: 1.26-bullseye
            goreleaser: "ci/goreleaser/goreleaser.yml"
            goflags: ""
            cgo: 1
            rpmvers: "el/7 el/8 el/9 amazon/2 amazon/2023"
            debvers: "ubuntu/xenial ubuntu/bionic ubuntu/focal ubuntu/jammy ubuntu/noble debian/jessie debian/buster debian/bullseye debian/bookworm"
            pc_repo: "tyk/tyk-ai-studio"
            docker_image: "tykio/tyk-ai-studio"
            dockerfile: "ci/Dockerfile.distroless"
          # Studio ENT
          - component: studio
            edition: ent
            golang_cross: 1.26-bullseye
            goreleaser: "ci/goreleaser/goreleaser.yml"
            goflags: "-tags=enterprise"
            cgo: 1
            rpmvers: "el/7 el/8 el/9 amazon/2 amazon/2023"
            debvers: "ubuntu/xenial ubuntu/bionic ubuntu/focal ubuntu/jammy ubuntu/noble debian/jessie debian/buster debian/bullseye debian/bookworm"
            pc_repo: "tyk/tyk-ee-unstable"
            docker_image: "tykio/tyk-ai-studio-ent"
            dockerfile: "ci/Dockerfile.distroless"
          # Microgateway CE
          - component: microgateway
            edition: ce
            golang_cross: 1.26-bullseye
            goreleaser: "ci/goreleaser/goreleaser-microgateway.yml"
            goflags: ""
            cgo: 1
            rpmvers: "el/7 el/8 el/9 amazon/2 amazon/2023"
            debvers: "ubuntu/xenial ubuntu/bionic ubuntu/focal ubuntu/jammy ubuntu/noble debian/jessie debian/buster debian/bullseye debian/bookworm"
            pc_repo: "tyk/tyk-ai-microgateway"
            docker_image: "tykio/tyk-microgateway"
            dockerfile: "ci/Dockerfile.microgateway.distroless"
          # Microgateway ENT
          - component: microgateway
            edition: ent
            golang_cross: 1.26-bullseye
            goreleaser: "ci/goreleaser/goreleaser-microgateway.yml"
            goflags: "-tags=enterprise"
            cgo: 1
            rpmvers: "el/7 el/8 el/9 amazon/2 amazon/2023"
            debvers: "ubuntu/xenial ubuntu/bionic ubuntu/focal ubuntu/jammy ubuntu/noble debian/jessie debian/buster debian/bullseye debian/bookworm"
            pc_repo: "tyk/tyk-ee-unstable"
            docker_image: "tykio/tyk-microgateway-ent"
            dockerfile: "ci/Dockerfile.microgateway.distroless"
    outputs:
      tags: ${{ steps.tag_metadata.outputs.tags }}
      commit_author: ${{ steps.set_outputs.outputs.commit_author}}
    steps:
      -
        name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies
      -
        name: Free disk space
        if: matrix.component == 'studio'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false
      -
        name: Checkout of midsommar
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          path: midsommar

      # Build the enterprise edition from the commit the submodule pins, not
      # from the enterprise repository's current main: the pin is what was
      # tested with this tree, and it is what enterprise-tag tags below.
      -
        name: Resolve enterprise submodule pin
        id: ent_pin
        if: matrix.edition == 'ent'
        run: echo "sha=$(git ls-tree HEAD enterprise | awk '$2 == "commit" {print $3}')" >> "$GITHUB_OUTPUT"
      -
        name: Checkout enterprise submodule
        if: matrix.edition == 'ent'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: TykTechnologies/ai-studio-enterprise
          ref: ${{ steps.ent_pin.outputs.sha }}
          path: midsommar/enterprise
          token: ${{ steps.app-token.outputs.token }}

      -
        name: Set some outputs for later
        id: set_outputs
        shell: bash
        env:
          HEAD_REF: ${{github.head_ref}}
        run: |
          echo "commit_author=$(git show -s --format='%ae' HEAD)" >> $GITHUB_OUTPUT
          echo "branch=${HEAD_REF##*/}" >> $GITHUB_OUTPUT
      -
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      -
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      -
        name: Login to DockerHub
        if: startsWith(github.ref, 'refs/tags')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      -
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.component }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.component }}-
            ${{ runner.os }}-go-

      -
        name: Use Node.js
        if: matrix.component == 'studio'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      -
        name: Build UI
        if: matrix.component == 'studio'
        run: |
          cd ui/admin-frontend
          echo "Installing dependencies..."
          npm ci --ignore-scripts
          npm rebuild
          echo "Building UI..."
          PUBLIC_URL="." REACT_APP_API_URL="" CI=false npm run build
          echo "Checking build output..."
          ls -la build
          echo "Checking static directory..."
          ls -la build/static
          echo "Checking index.html..."
          cat build/index.html | head -n 5
          echo "Verifying static files..."
          find build -type f
          cd ../..

      -
        name: Build docs site
        if: matrix.component == 'studio'
        run: |
          cd docs/site
          npm ci --ignore-scripts
          npm rebuild
          NODE_ENV=production npm run docs:build
          cd ../..

      -
        name: Build
        env:
          NFPM_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSPHRASE }}
          PKG_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
        run: |
          pwd
          ls
          echo '#!/bin/sh
          ci/bin/unlock-agent.sh
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          git config --global --add safe.directory /go/src/github.com/TykTechnologies/midsommar
          if [ "$EDITION" = "ce" ]; then
            sed -i "/github.com\/TykTechnologies\/ai-studio-enterprise/d" go.mod
            sed -i "/github.com\/TykTechnologies\/ai-studio-enterprise/d" microgateway/go.mod
          fi
          if [ "$IS_TAG" = "true" ]; then
            goreleaser release --clean -f "$GORELEASER_CONFIG" --skip=validate
          else
            goreleaser release --clean -f "$GORELEASER_CONFIG" --skip=validate,sign --snapshot
          fi' > /tmp/build.sh
          chmod +x /tmp/build.sh
          pwd
          docker run --rm --privileged -e GITHUB_TOKEN=${{ github.token }} \
          -e EDITION='${{ matrix.edition }}'                                     \
          -e IS_TAG="${{ startsWith(github.ref, 'refs/tags/') }}"                \
          -e GORELEASER_CONFIG='${{ matrix.goreleaser }}'                         \
          -e GOPRIVATE=github.com/TykTechnologies                                \
          -e GOFLAGS='${{ matrix.goflags }}'                              \
          -e DEBVERS='${{ matrix.debvers }}'                               \
          -e RPMVERS='${{ matrix.rpmvers }}'                               \
          -e CGO_ENABLED=${{ matrix.cgo }}                                 \
          -e NFPM_PASSPHRASE="$NFPM_PASSPHRASE"                          \
          -e GPG_FINGERPRINT=12B5D62C28F57592D1575BD51ED14C59E37DAC20            \
          -e PKG_SIGNING_KEY="$PKG_SIGNING_KEY"                                  \
          -e PACKAGECLOUD_TOKEN=$PACKAGECLOUD_TOKEN                              \
          -e PACKAGECLOUD_REPO='${{ matrix.pc_repo }}'                    \
          -v ${{github.workspace}}/midsommar:/go/src/github.com/TykTechnologies/midsommar \
          -v /var/run/docker.sock:/var/run/docker.sock                           \
          -v ~/.docker/config.json:/root/.docker/config.json                     \
          -e GOCACHE=/cache/go-build                                             \
          -e GOMODCACHE=/go/pkg/mod                                              \
          -v ~/go/pkg/mod:/go/pkg/mod                                            \
          -v ~/.cache/go-build:/cache/go-build                                   \
          -v /tmp/build.sh:/tmp/build.sh                                         \
          -w /go/src/github.com/TykTechnologies/midsommar                      \
          tykio/golang-cross:${{ matrix.golang_cross }} /tmp/build.sh
      -
        name: Docker metadata for tag push
        id: tag_metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ matrix.docker_image }}
          flavor: |
            latest=false
            prefix=v
          tags: |
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}
          labels: "org.opencontainers.image.title=${{ matrix.component }} (${{ matrix.edition }})\norg.opencontainers.image.description=Tyk AI ${{ matrix.component == 'studio' && 'Studio' || 'Microgateway' }} (${{ matrix.edition }})\norg.opencontainers.image.vendor=tyk.io\norg.opencontainers.image.version=${{ github.ref_name }}\n"
      -
        name: push image to prod
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: "midsommar/dist"
          platforms: linux/amd64,linux/arm64
          file: midsommar/${{ matrix.dockerfile }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: ${{ startsWith(github.ref, 'refs/tags') }}
          tags: ${{ steps.tag_metadata.outputs.tags }}
          labels: ${{ steps.tag_metadata.outputs.labels }}
      -
        name: save deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb-${{ matrix.component }}-${{ matrix.edition }}
          retention-days: 1
          path: |
            dist/*.deb
            !dist/*PAYG*.deb
            !dist/*fips*.deb
      -
        name: save rpm
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpm-${{ matrix.component }}-${{ matrix.edition }}
          retention-days: 1
          path: |
            dist/*.rpm
            !dist/*PAYG*.rpm
            !dist/*fips*.rpm

  # The built admin frontend, for hosts that embed Studio through pkg/studio.
  # They compile with -tags studio_noui (the ui package then embeds nothing)
  # and serve these files with studio.Options.UIAssets; see
  # pkg/studio/README.md. Attached to the tag's GitHub release, which is
  # created as a draft when it does not exist yet.
  ui-assets:
    name: "ui-assets"
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write # upload the release asset
    steps:
      -
        name: Checkout of midsommar
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          path: midsommar
      -
        name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"
      -
        name: Build UI
        run: |
          cd ui/admin-frontend
          npm ci --ignore-scripts
          npm rebuild
          PUBLIC_URL="." REACT_APP_API_URL="" CI=false npm run build
          test -f build/index.html
      -
        name: Attach UI assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          asset="tyk-ai-studio-ui-${TAG}.tar.gz"
          tar -czf "$asset" -C ui/admin-frontend/build .
          sha256sum "$asset" > "$asset.sha256"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" \
              --notes "AI Studio $TAG. Assets are attached by the release workflow."
          fi
          gh release upload "$TAG" "$asset" "$asset.sha256" --clobber

  # Tags the enterprise repository with the same version, on the commit the
  # submodule pins, so a host can require
  # github.com/TykTechnologies/ai-studio-enterprise/v2 at this version next to
  # github.com/TykTechnologies/midsommar/v2. Fails if the pin is not on
  # enterprise main. The app needs contents:write on ai-studio-enterprise.
  enterprise-tag:
    name: "enterprise-tag"
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      -
        name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies
      -
        name: Checkout of midsommar
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          path: midsommar
      -
        name: Tag ai-studio-enterprise
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: scripts/release/tag-enterprise.sh "${{ github.ref_name }}"

  # Imports this version the way a host embedding Studio does (the Tyk
  # Dashboard): clean module cache, through the module proxy, go mod tidy and
  # a CGO_ENABLED=0 build. ce runs without any credentials, because a
  # Community Edition host must never need the private enterprise module;
  # ent also requires ai-studio-enterprise at the same version.
  consume-module:
    name: "consume-module-${{ matrix.edition }}"
    runs-on: ubuntu-latest
    needs: [enterprise-tag]
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        edition: [ce, ent]
    steps:
      -
        name: Generate GitHub App token
        id: app-token
        if: matrix.edition == 'ent'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies
      -
        name: Checkout of midsommar
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          path: midsommar
      -
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: midsommar/go.mod
          cache: false
      -
        name: Credentials for the enterprise module
        if: matrix.edition == 'ent'
        run: git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/TykTechnologies/ai-studio-enterprise".insteadOf "https://github.com/TykTechnologies/ai-studio-enterprise"
      -
        name: Build a host that imports Studio ${{ github.ref_name }}
        run: scripts/release/consume-module.sh "${{ matrix.edition }}" "${{ github.ref_name }}"
