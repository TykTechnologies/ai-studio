# yamllint disable rule:line-length rule:truthy
name: Release
# Based on gromit policy, extended for component/edition matrix

# Distribution channels covered by this workflow
# - Ubuntu and Debian (DEB)
# - RHEL and AL (RPM)
# - Docker Hub
# - Cloudsmith
# A pre-release tag (vX.Y.Z-suffix, e.g. v2.3.0-unstable.1) publishes Docker
# images only, under that exact tag: no packages, and never latest or vX.Y.
on:
  push:
    tags:
      - "v*"

defaults:
  run:
    working-directory: midsommar

env:
  # Only the enterprise module is private; every other TykTechnologies module
  # (tyk-identity-broker, storage, ...) is public and comes through the proxy.
  # (Fetching those with git broke CI when a cached clone missed a new tag.)
  GOPRIVATE: github.com/TykTechnologies/ai-studio-enterprise
  VARIATION: inverted
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false
  BASE_REF: ${{startsWith(github.event_name, 'pull_request') && github.base_ref || github.ref_name}}
jobs:
  # Nothing is published, and the enterprise repository is not tagged, until
  # the full test suite (release-gate.yml) has passed on the tagged commit.
  # A passing Release Gate run on the same commit (run by hand before the
  # tag, or the nightly run) is reused; otherwise the gate runs here first.
  gate-check:
    name: "gate-check"
    runs-on: ubuntu-latest
    permissions:
      actions: read # list Release Gate runs
    outputs:
      reuse: ${{ steps.find.outputs.reuse }}
    defaults:
      run:
        working-directory: .
    steps:
      -
        name: Find a passing Release Gate run for this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/${{ github.repository }}/actions/workflows/release-gate.yml/runs?head_sha=${{ github.sha }}&status=success&per_page=1" \
            --jq '.workflow_runs[0].html_url // empty')
          if [ -n "$url" ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "Release gate already passed on ${{ github.sha }}: $url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "No passing Release Gate run for ${{ github.sha }}; running it now." >> "$GITHUB_STEP_SUMMARY"
          fi

  run-gate:
    name: "release-gate"
    needs: [gate-check]
    if: needs.gate-check.outputs.reuse != 'true'
    uses: ./.github/workflows/release-gate.yml
    secrets: inherit

  goreleaser:
    name: "${{ matrix.component }}-${{ matrix.edition }}"
    needs: [gate-check, run-gate]
    if: ${{ !cancelled() && needs.gate-check.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.run-gate.result) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # AWS OIDC JWT
      contents: read # actions/checkout
    strategy:
      fail-fast: false
      matrix:
        component: [studio, microgateway]
        edition: [ce, ent]
        include:
          # Studio CE
          - component: studio
            edition: ce
            golang_cross: 1.26-bullseye
            goreleaser: "ci/goreleaser/goreleaser.yml"
            goflags: ""
            cgo: 1
            rpmvers: "el/7 el/8 el/9 amazon/2 amazon/2023"
            debvers: "ubuntu/xenial ubuntu/bionic ubuntu/focal ubuntu/jammy ubuntu/noble debian/jessie debian/buster debian/bullseye debian/bookworm"
            pc_repo: "tyk/tyk-ai-studio"
            docker_image: "tykio/tyk-ai-studio"
            dockerfile: "ci/Dockerfile.distroless"
          # Studio ENT
          - component: studio
            edition: ent
            golang_cross: 1.26-bullseye
            goreleaser: "ci/goreleaser/goreleaser.yml"
            goflags: "-tags=enterprise"
            cgo: 1
            rpmvers: "el/7 el/8 el/9 amazon/2 amazon/2023"
            debvers: "ubuntu/xenial ubuntu/bionic ubuntu/focal ubuntu/jammy ubuntu/noble debian/jessie debian/buster debian/bullseye debian/bookworm"
            pc_repo: "tyk/tyk-ee-unstable"
            docker_image: "tykio/tyk-ai-studio-ent"
            dockerfile: "ci/Dockerfile.distroless"
          # Microgateway CE
          - component: microgateway
            edition: ce
            golang_cross: 1.26-bullseye
            goreleaser: "ci/goreleaser/goreleaser-microgateway.yml"
            goflags: ""
            cgo: 1
            rpmvers: "el/7 el/8 el/9 amazon/2 amazon/2023"
            debvers: "ubuntu/xenial ubuntu/bionic ubuntu/focal ubuntu/jammy ubuntu/noble debian/jessie debian/buster debian/bullseye debian/bookworm"
            pc_repo: "tyk/tyk-ai-microgateway"
            docker_image: "tykio/tyk-microgateway"
            dockerfile: "ci/Dockerfile.microgateway.distroless"
          # Microgateway ENT
          - component: microgateway
            edition: ent
            golang_cross: 1.26-bullseye
            goreleaser: "ci/goreleaser/goreleaser-microgateway.yml"
            goflags: "-tags=enterprise"
            cgo: 1
            rpmvers: "el/7 el/8 el/9 amazon/2 amazon/2023"
            debvers: "ubuntu/xenial ubuntu/bionic ubuntu/focal ubuntu/jammy ubuntu/noble debian/jessie debian/buster debian/bullseye debian/bookworm"
            pc_repo: "tyk/tyk-ee-unstable"
            docker_image: "tykio/tyk-microgateway-ent"
            dockerfile: "ci/Dockerfile.microgateway.distroless"
    outputs:
      tags: ${{ steps.tag_metadata.outputs.tags }}
      commit_author: ${{ steps.set_outputs.outputs.commit_author}}
    steps:
      -
        name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies
      -
        name: Free disk space
        if: matrix.component == 'studio'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false
      -
        name: Checkout of midsommar
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          path: midsommar

      # Build the enterprise edition from the commit the submodule pins, not
      # from the enterprise repository's current main: the pin is what was
      # tested with this tree, and it is what enterprise-tag tags below.
      -
        name: Resolve enterprise submodule pin
        id: ent_pin
        if: matrix.edition == 'ent'
        run: echo "sha=$(git ls-tree HEAD enterprise | awk '$2 == "commit" {print $3}')" >> "$GITHUB_OUTPUT"
      -
        name: Checkout enterprise submodule
        if: matrix.edition == 'ent'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: TykTechnologies/ai-studio-enterprise
          ref: ${{ steps.ent_pin.outputs.sha }}
          path: midsommar/enterprise
          token: ${{ steps.app-token.outputs.token }}

      -
        name: Set some outputs for later
        id: set_outputs
        shell: bash
        env:
          HEAD_REF: ${{github.head_ref}}
        run: |
          echo "commit_author=$(git show -s --format='%ae' HEAD)" >> $GITHUB_OUTPUT
          echo "branch=${HEAD_REF##*/}" >> $GITHUB_OUTPUT
      -
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      -
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      -
        name: Login to DockerHub
        if: startsWith(github.ref, 'refs/tags')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      -
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.component }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.component }}-
            ${{ runner.os }}-go-

      -
        name: Use Node.js
        if: matrix.component == 'studio'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      -
        name: Build UI
        if: matrix.component == 'studio'
        run: |
          cd ui/admin-frontend
          echo "Installing dependencies..."
          npm ci --ignore-scripts
          npm rebuild
          echo "Building UI..."
          PUBLIC_URL="." REACT_APP_API_URL="" CI=false npm run build
          echo "Checking build output..."
          ls -la build
          echo "Checking static directory..."
          ls -la build/static
          echo "Checking index.html..."
          cat build/index.html | head -n 5
          echo "Verifying static files..."
          find build -type f
          cd ../..

      -
        name: Build docs site
        if: matrix.component == 'studio'
        run: |
          cd docs/site
          npm ci --ignore-scripts
          npm rebuild
          NODE_ENV=production npm run docs:build
          cd ../..

      -
        name: Build
        env:
          NFPM_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSPHRASE }}
          PKG_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
        run: |
          pwd
          ls
          echo '#!/bin/sh
          ci/bin/unlock-agent.sh
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          git config --global --add safe.directory /go/src/github.com/TykTechnologies/midsommar
          if [ "$EDITION" = "ce" ]; then
            sed -i "/github.com\/TykTechnologies\/ai-studio-enterprise/d" go.mod
            sed -i "/github.com\/TykTechnologies\/ai-studio-enterprise/d" microgateway/go.mod
          fi
          if [ "$IS_TAG" = "true" ]; then
            # A pre-release tag (vX.Y.Z-anything) ships Docker images only: its
            # packages would land in the CE package repos, where apt/yum would
            # upgrade 2.x users to it. They are still built (and saved below).
            case "$TAG_NAME" in
              *-*) goreleaser release --clean -f "$GORELEASER_CONFIG" --skip=validate,publish ;;
              *) goreleaser release --clean -f "$GORELEASER_CONFIG" --skip=validate ;;
            esac
          else
            goreleaser release --clean -f "$GORELEASER_CONFIG" --skip=validate,sign --snapshot
          fi' > /tmp/build.sh
          chmod +x /tmp/build.sh
          pwd
          docker run --rm --privileged -e GITHUB_TOKEN=${{ github.token }} \
          -e EDITION='${{ matrix.edition }}'                                     \
          -e IS_TAG="${{ startsWith(github.ref, 'refs/tags/') }}"                \
          -e TAG_NAME='${{ github.ref_name }}'                                   \
          -e GORELEASER_CONFIG='${{ matrix.goreleaser }}'                         \
          -e GOPRIVATE=github.com/TykTechnologies/ai-studio-enterprise           \
          -e GOFLAGS='${{ matrix.goflags }}'                              \
          -e DEBVERS='${{ matrix.debvers }}'                               \
          -e RPMVERS='${{ matrix.rpmvers }}'                               \
          -e CGO_ENABLED=${{ matrix.cgo }}                                 \
          -e NFPM_PASSPHRASE="$NFPM_PASSPHRASE"                          \
          -e GPG_FINGERPRINT=12B5D62C28F57592D1575BD51ED14C59E37DAC20            \
          -e PKG_SIGNING_KEY="$PKG_SIGNING_KEY"                                  \
          -e PACKAGECLOUD_TOKEN=$PACKAGECLOUD_TOKEN                              \
          -e PACKAGECLOUD_REPO='${{ matrix.pc_repo }}'                    \
          -v ${{github.workspace}}/midsommar:/go/src/github.com/TykTechnologies/midsommar \
          -v /var/run/docker.sock:/var/run/docker.sock                           \
          -v ~/.docker/config.json:/root/.docker/config.json                     \
          -e GOCACHE=/cache/go-build                                             \
          -e GOMODCACHE=/go/pkg/mod                                              \
          -v ~/go/pkg/mod:/go/pkg/mod                                            \
          -v ~/.cache/go-build:/cache/go-build                                   \
          -v /tmp/build.sh:/tmp/build.sh                                         \
          -w /go/src/github.com/TykTechnologies/midsommar                      \
          tykio/golang-cross:${{ matrix.golang_cross }} /tmp/build.sh
      -
        # Each goreleaser build already runs scripts/fips-verify.sh as a post
        # hook, which fails the release before anything is published. This
        # re-checks the whole dist/ (FIPS binaries are FIPS, standard ones are
        # not, ENT ones carry the enterprise tag) before images are built.
        name: Verify FIPS build metadata
        run: |
          docker run --rm \
          -v ${{github.workspace}}/midsommar:/go/src/github.com/TykTechnologies/midsommar \
          -w /go/src/github.com/TykTechnologies/midsommar \
          tykio/golang-cross:${{ matrix.golang_cross }} \
          scripts/fips-verify.sh --edition '${{ matrix.edition }}' --dist dist
      -
        name: Docker metadata for tag push
        id: tag_metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ matrix.docker_image }}
          flavor: |
            latest=false
            prefix=v
          tags: |
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}
          labels: "org.opencontainers.image.title=${{ matrix.component }} (${{ matrix.edition }})\norg.opencontainers.image.description=Tyk AI ${{ matrix.component == 'studio' && 'Studio' || 'Microgateway' }} (${{ matrix.edition }})\norg.opencontainers.image.vendor=tyk.io\norg.opencontainers.image.version=${{ github.ref_name }}\n"
      -
        name: push image to prod
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: "midsommar/dist"
          platforms: linux/amd64,linux/arm64
          file: midsommar/${{ matrix.dockerfile }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: ${{ startsWith(github.ref, 'refs/tags') }}
          tags: ${{ steps.tag_metadata.outputs.tags }}
          labels: ${{ steps.tag_metadata.outputs.labels }}
      -
        name: save deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb-${{ matrix.component }}-${{ matrix.edition }}
          retention-days: 1
          path: |
            dist/*.deb
            !dist/*PAYG*.deb
            !dist/*fips*.deb
      -
        name: save rpm
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpm-${{ matrix.component }}-${{ matrix.edition }}
          retention-days: 1
          path: |
            dist/*.rpm
            !dist/*PAYG*.rpm
            !dist/*fips*.rpm

  # The built admin frontend, for hosts that embed Studio through pkg/studio.
  # They compile with -tags studio_noui (the ui package then embeds nothing)
  # and serve these files with studio.Options.UIAssets; see
  # pkg/studio/README.md. Attached to the tag's GitHub release. The job
  # creates that release (published, not a draft, with placeholder notes)
  # when it does not exist yet, so the release notes are added afterwards
  # with `gh release edit <tag> --notes-file ... [--latest]`; a
  # `gh release create <tag>` after this job fails with "already exists".
  ui-assets:
    name: "ui-assets"
    runs-on: ubuntu-latest
    needs: [gate-check, run-gate]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.gate-check.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.run-gate.result) }}
    permissions:
      contents: write # upload the release asset
    steps:
      -
        name: Checkout of midsommar
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          path: midsommar
      -
        name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"
      -
        name: Build UI
        run: |
          cd ui/admin-frontend
          npm ci --ignore-scripts
          npm rebuild
          PUBLIC_URL="." REACT_APP_API_URL="" CI=false npm run build
          test -f build/index.html
      -
        name: Attach UI assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          asset="tyk-ai-studio-ui-${TAG}.tar.gz"
          tar -czf "$asset" -C ui/admin-frontend/build .
          sha256sum "$asset" > "$asset.sha256"
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            # A draft (as earlier versions of this job created) cannot be
            # found by tag by hosts or by a later `gh release create`.
            if [ "$draft" = true ]; then
              gh release edit "$TAG" --draft=false
            fi
          else
            prerelease=()
            case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
            # --latest=false: the placeholder notes are replaced by hand
            # (gh release edit "$TAG" --notes-file notes.md --latest).
            gh release create "$TAG" --verify-tag --title "$TAG" --latest=false "${prerelease[@]}" \
              --notes "AI Studio $TAG. Assets are attached by the release workflow; release notes follow."
          fi
          gh release upload "$TAG" "$asset" "$asset.sha256" --clobber

  # Tags the enterprise repository with the same version, on the commit the
  # submodule pins, so a host can require
  # github.com/TykTechnologies/ai-studio-enterprise/v2 at this version next to
  # github.com/TykTechnologies/midsommar/v2. Fails if the pin is not on
  # enterprise main. The app needs contents:write on ai-studio-enterprise.
  enterprise-tag:
    name: "enterprise-tag"
    runs-on: ubuntu-latest
    needs: [gate-check, run-gate]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.gate-check.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.run-gate.result) }}
    steps:
      -
        name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies
      -
        name: Checkout of midsommar
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          path: midsommar
      -
        name: Tag ai-studio-enterprise
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: scripts/release/tag-enterprise.sh "${{ github.ref_name }}"
