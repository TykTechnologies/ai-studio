name: Deploy to chat.tyk.technology

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # Only the enterprise module is private; every other TykTechnologies module
  # (tyk-identity-broker, storage, ...) is public and comes through the proxy.
  # (Fetching those with git broke CI when a cached clone missed a new tag.)
  GOPRIVATE: github.com/TykTechnologies/ai-studio-enterprise

jobs:
  # Build frontend once and share across all editions
  build-frontend:
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Build UI
        run: |
          cd ui/admin-frontend
          echo "Installing dependencies..."
          npm ci --ignore-scripts
          npm rebuild
          echo "Building UI..."
          PUBLIC_URL="." REACT_APP_API_URL="" CI=false npm run build
          echo "Checking build output..."
          ls -la build
          echo "Verifying static files..."
          find build -type f | head -20
          cd ../..

      - name: Upload Frontend Build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build
          path: ui/admin-frontend/build/
          retention-days: 1

  # Build Community Edition binaries
  build-ce-binaries:
    needs: build-frontend
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download Frontend Build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: ui/admin-frontend/build/

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc libsqlite3-dev

      - name: Build docs site
        run: |
          cd docs/site && npm ci --ignore-scripts && npm rebuild && NODE_ENV=production npm run docs:build

      - name: Remove enterprise module references for CE
        run: |
          sed -i '/github.com\/TykTechnologies\/ai-studio-enterprise/d' go.mod

      - name: Build CE Binaries
        run: |
          echo "Building CE binaries with CGO enabled..."
          echo "Building AMD64 binary..."
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-w -s" -trimpath \
            -o tyk-ai-studio-ce-amd64

          echo "Building ARM64 binary..."
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            go build -ldflags="-w -s" -trimpath \
            -o tyk-ai-studio-ce-arm64

          chmod +x tyk-ai-studio-ce-*
          ls -lh tyk-ai-studio-ce-*

      - name: Upload CE Binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ce-binaries
          path: tyk-ai-studio-ce-*
          retention-days: 1

  # Build Community Edition Docker image
  build-ce-image:
    needs: [build-frontend, build-ce-binaries]
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Frontend Build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: ui/admin-frontend/build/

      - name: Download CE Binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ce-binaries

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and Push CE Images
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Push output images pinned to commit SHA and latest for deploy
          tags: |
            tykio/tyk-ai-studio:${{ github.sha }}
            tykio/tyk-ai-studio:latest
            tykio/midsommar:${{ github.sha }}
            tykio/midsommar:latest
          build-args: |
            EDITION=ce
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Report only, and after the push: this multi-platform build goes straight
      # to Docker Hub, so the image cannot be scanned before it is public yet.
      # continue-on-error: the action fails on scanner errors even when not
      # enforcing, which would otherwise skip deploy-ce.
      - name: Scan the CE image for secrets
        continue-on-error: true
        uses: TykTechnologies/github-actions/.github/actions/secret-scan@production
        with:
          image: tykio/tyk-ai-studio@${{ steps.build.outputs.digest }}
          enforce: "false"

  # Build Enterprise Edition binaries
  build-ent-binaries:
    needs: build-frontend
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0 # zizmor: ignore[github-app] owner-wide token, scoping tracked separately
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git for Enterprise Access
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Initialize Enterprise Submodule
        run: |
          git submodule update --init --recursive
          if [ ! -f enterprise/.git ]; then
            echo "ERROR: Enterprise submodule not initialized"
            exit 1
          fi
          echo "Enterprise submodule initialized"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download Frontend Build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: ui/admin-frontend/build/

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc libsqlite3-dev

      - name: Build docs site
        run: |
          cd docs/site && npm ci --ignore-scripts && npm rebuild && NODE_ENV=production npm run docs:build

      - name: Build ENT Binaries
        run: |
          echo "Building ENT binaries with CGO enabled and enterprise tags..."
          # The root go.mod does not require the enterprise module: link its
          # registrations in and resolve it through enterprise.work.
          scripts/enterprise-link-tests.sh
          export GOWORK="$PWD/enterprise.work"
          echo "Building AMD64 binary..."
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -tags enterprise -ldflags="-w -s" -trimpath \
            -o tyk-ai-studio-ent-amd64

          echo "Building ARM64 binary..."
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            go build -tags enterprise -ldflags="-w -s" -trimpath \
            -o tyk-ai-studio-ent-arm64

          chmod +x tyk-ai-studio-ent-*
          ls -lh tyk-ai-studio-ent-*

      - name: Upload ENT Binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ent-binaries
          path: tyk-ai-studio-ent-*
          retention-days: 1

  # Build Enterprise Edition Docker image
  build-ent-image:
    needs: [build-frontend, build-ent-binaries]
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0 # zizmor: ignore[github-app] owner-wide token, scoping tracked separately
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Download Frontend Build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: ui/admin-frontend/build/

      - name: Download ENT Binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ent-binaries

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and Push ENT Images
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Push output images pinned to commit SHA and latest for deploy
          tags: |
            tykio/tyk-ai-studio-enterprise:${{ github.sha }}
            tykio/tyk-ai-studio-enterprise:latest
            tykio/midsommar-enterprise:${{ github.sha }}
            tykio/midsommar-enterprise:latest
          build-args: |
            EDITION=ent
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Report only, and after the push, as for the CE image above.
      - name: Scan the ENT image for secrets
        continue-on-error: true
        uses: TykTechnologies/github-actions/.github/actions/secret-scan@production
        with:
          image: tykio/tyk-ai-studio-enterprise@${{ steps.build.outputs.digest }}
          enforce: "false"

  # Deploy CE image to production server
  deploy-ce:
    needs: build-ce-image
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - name: Deploy to Remote Server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
          ssh $SSH_USER@$SSH_HOST "cd /root/ai-studio && docker compose pull && docker compose up --detach"
