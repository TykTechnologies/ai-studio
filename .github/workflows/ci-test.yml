name: CI Tests

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # Only the enterprise module is private; every other TykTechnologies module
  # (tyk-identity-broker, storage, ...) is public and comes through the proxy.
  # (Fetching those with git broke CI when a cached clone missed a new tag.)
  GOPRIVATE: github.com/TykTechnologies/ai-studio-enterprise
  # GitHub gives pull requests from forks no secrets, so they cannot check
  # out the private enterprise submodule. They run the Community Edition
  # checks only; a maintainer runs the rest by pushing the branch into this
  # repository (see CONTRIBUTING.md). The go-unit-tests matrix repeats this
  # expression, because env is not available there.
  FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

jobs:
  # ==========================================================================
  # Dependency Guard
  # ==========================================================================
  dep-guard:
    uses: TykTechnologies/github-actions/.github/workflows/dependency-guard.yml@d3fa20888fa2878e877e22bb7702141217290e7c  # main
    permissions:
      contents: read

  # ==========================================================================
  # Go Linting (disabled for now)
  # ==========================================================================
  golangci-lint:
    if: false
    runs-on: warp-ubuntu-latest-arm64-4x
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - name: Fetch base branch
        if: ${{ github.event_name == 'pull_request' }}
        run: git fetch origin ${{ github.base_ref }}

      - name: golangci-lint
        if: ${{ github.event_name == 'pull_request' }}
        uses: golangci/golangci-lint-action@3a919529898de77ec3da873e3063ca4b10e7f5cc # v3
        with:
          version: latest
          args: --out-format=checkstyle:golanglint.xml --timeout=600s --max-issues-per-linter=0 --max-same-issues=0 --new-from-rev=origin/${{ github.base_ref }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golangcilint
          retention-days: 1
          path: |
            golanglint.xml

  # ==========================================================================
  # Frontend Tests (Jest)
  # ==========================================================================
  frontend-tests:
    needs: [dep-guard]
    name: Frontend Tests
    runs-on: warp-ubuntu-latest-arm64-2x
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install and Test Frontend
        env:
          CI: true
        run: |
          cd ui/admin-frontend
          npm ci --ignore-scripts
          npm rebuild
          npm test -- --forceExit

      - name: Build Frontend
        run: |
          cd ui/admin-frontend
          CI=false npm run build

  # ==========================================================================
  # Go Unit Tests (Studio + Microgateway) - Matrix for CE/ENT
  # ==========================================================================
  go-unit-tests:
    needs: [dep-guard]
    name: Go Unit Tests (${{ matrix.edition }})
    runs-on: warp-ubuntu-latest-arm64-4x
    strategy:
      fail-fast: false
      matrix:
        # Fork pull requests run CE only (see FORK_PR above).
        edition: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ce"]' || '["ce", "ent"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
          submodules: ${{ matrix.edition == 'ent' }}
          token: ${{ secrets.CI_SUBMODULE_PAT || github.token }}

      - name: Create enterprise stub for CE builds
        if: matrix.edition == 'ce'
        run: |
          mkdir -p enterprise
          cat > enterprise/go.mod << 'EOF'
          module github.com/TykTechnologies/ai-studio-enterprise/v2

          go 1.26.5
          EOF

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Go Cache
        uses: WarpBuilds/cache@f643a1ba29942d56621d07fc2d4284c7219868ad # v1
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.edition }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.edition }}-
            ${{ runner.os }}-go-

      - name: Set build tags
        id: tags
        run: |
          if [ "${{ matrix.edition }}" == "ent" ]; then
            echo "BUILD_TAGS=-tags enterprise" >> $GITHUB_OUTPUT
          else
            echo "BUILD_TAGS=" >> $GITHUB_OUTPUT
          fi

      - name: Verify Go dependencies
        run: |
          go mod verify
          cd microgateway && go mod verify

      - name: Create placeholders for embeds
        run: |
          # Create placeholder for docs embed (tests don't need actual docs)
          mkdir -p docs/site/dist
          echo "placeholder" > docs/site/dist/index.html
          # Create placeholder for frontend embed (tests don't need actual frontend)
          mkdir -p ui/admin-frontend/build
          echo "placeholder" > ui/admin-frontend/build/index.html
          # Use dev environment template for tests
          cp dev/.env.dev .env

      # Enterprise tests of core packages live in the enterprise repository
      # (enterprise/_coretests) and are linked into their packages here.
      - name: Link enterprise tests of core packages
        if: matrix.edition == 'ent'
        run: make ent-link

      # go vet over our own code; third_party/ (the vendored gorm) is left
      # out, see third_party/README.md. The ent edition also vets the
      # enterprise module.
      - name: Go vet
        run: scripts/vet.sh ${{ matrix.edition }}

      # A host embedding pkg/studio may build without cgo (the Dashboard's dev
      # builds do), so pkg/studio must compile with CGO_ENABLED=0.
      - name: Build pkg/studio without cgo
        run: |
          CGO_ENABLED=0 go build -o /dev/null \
            -tags "studio_noui ${{ matrix.edition == 'ent' && 'enterprise' || '' }}" ./pkg/studio/...

      - name: Run AI Studio Unit Tests
        run: |
          go test ${{ steps.tags.outputs.BUILD_TAGS }} -v -race -short \
            -coverprofile=coverage-studio-${{ matrix.edition }}.out \
            -covermode=atomic ./...

      - name: Run Microgateway Unit Tests
        run: |
          cd microgateway
          go test ${{ steps.tags.outputs.BUILD_TAGS }} -v -race -short \
            -coverprofile=../coverage-microgateway-${{ matrix.edition }}.out \
            -covermode=atomic ./...

      - name: Upload Coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.edition }}
          path: coverage-*.out
          retention-days: 7

  # ==========================================================================
  # Go Postgres Tests: the tests that need a real PostgreSQL (SQLite hides
  # multi-connection behaviour: advisory locks, concurrent find-or-create,
  # transaction deadlocks, dialect-specific SQL). They skip without
  # DATABASE_URL, so the unit jobs above never run them.
  # ==========================================================================
  go-postgres-tests:
    needs: [dep-guard]
    name: Go Postgres Tests
    runs-on: warp-ubuntu-latest-arm64-4x
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: midsommar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/midsommar_test?sslmode=disable
    steps:
      # The enterprise submodule is checked out for the audit suite below;
      # the other packages are built without the enterprise tag. Fork pull
      # requests get a stub instead and skip the audit suite.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
          submodules: ${{ env.FORK_PR != 'true' }}
          token: ${{ secrets.CI_SUBMODULE_PAT || github.token }}

      - name: Create enterprise stub for fork pull requests
        if: env.FORK_PR == 'true'
        run: |
          mkdir -p enterprise
          cat > enterprise/go.mod << 'EOF'
          module github.com/TykTechnologies/ai-studio-enterprise/v2

          go 1.26.5
          EOF

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Go Cache
        uses: WarpBuilds/cache@f643a1ba29942d56621d07fc2d4284c7219868ad # v1
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-ce-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-ce-
            ${{ runner.os }}-go-

      - name: Create placeholders for embeds
        run: |
          mkdir -p docs/site/dist ui/admin-frontend/build
          echo "placeholder" > docs/site/dist/index.html
          echo "placeholder" > ui/admin-frontend/build/index.html
          cp dev/.env.dev .env

      # One package at a time (-p 1): the packages share the database, and
      # tests that are not schema-isolated would otherwise migrate it at once.
      - name: Run Postgres tests
        run: |
          go test -v -race -p 1 -count=1 \
            -run 'PostgreSQL|_Postgres|InTransaction|EnsureInDefaultCatalogue' \
            ./models/ ./services/ ./pkg/studio/

      # Packages whose Postgres-gated tests used to run nowhere: the chat
      # queue (LISTEN/NOTIFY), config and startup.
      - name: Run chat queue, config and startup Postgres tests
        run: |
          go test -v -race -p 1 -count=1 ./chat_session/ ./config/ ./startup/

      # The cluster code runs on every Postgres deployment: the event log and
      # node registry, the shared LISTEN connection, durable pushes and the
      # leader lease. Each test works in a schema of its own; the push and
      # lease tests run their SQLite and Postgres cases side by side.
      - name: Run cluster Postgres tests
        run: |
          go test -v -race -p 1 -count=1 \
            ./pkg/cluster/ ./pkg/pglisten/ ./services/pushes/ ./services/scheduler/

      # The edge, the enterprise audit suite and the budget tracker test get
      # databases of their own: the edge schema has its own apps/llms tables,
      # and the budget test drops and recreates the tables it uses.
      - name: Create edge, audit and budget databases
        run: |
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE mgw_test'
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE audit_test'
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE budget_test'

      # Pushes and the event-bus relay across several control-server replicas
      # on one database, and the budget usage tracker's queries.
      - name: Run gRPC push, relay and budget Postgres tests
        env:
          BUDGET_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/budget_test?sslmode=disable
        run: |
          go test -v -race -count=1 -run 'TestPushCluster_|TestRelay_|_Postgres' ./grpc/

      # Analytics writer, budget ledger and budget sync against Postgres
      # (ON CONFLICT, GREATEST, enforced foreign keys), and the edge schema
      # snapshot.
      - name: Run microgateway Postgres tests
        working-directory: microgateway
        env:
          MGW_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/mgw_test?sslmode=disable
        run: |
          go test -v -race -count=1 -run 'Postgres' ./internal/services/ ./internal/database/

      # Real edges against several Studio replicas sharing DATABASE_URL (a
      # schema per test): pushes land whatever happens to the connections.
      - name: Run microgateway cluster Postgres tests
        working-directory: microgateway
        run: |
          go test -v -race -count=1 ./tests/cluster/

      - name: Run enterprise audit and webhooks Postgres tests
        if: env.FORK_PR != 'true'
        working-directory: enterprise
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/audit_test?sslmode=disable
        run: |
          go test -tags enterprise -v -race -count=1 ./features/audit/...
          go test -tags enterprise -v -race -count=1 -run '_Postgres' ./features/webhooks/

  # ==========================================================================
  # gorm copy: third_party/gorm.io is exactly what third_party/gorm-pin
  # produces, and no module imports gorm.io (see third_party/README.md)
  # ==========================================================================
  gorm-verify:
    needs: [dep-guard]
    name: gorm Copy Verification
    runs-on: warp-ubuntu-latest-arm64-2x
    steps:
      # The enterprise module is part of the import check. Fork pull requests
      # check the root and microgateway modules in the CE edition only.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: ${{ env.FORK_PR != 'true' }}
          token: ${{ secrets.CI_SUBMODULE_PAT || github.token }}

      - name: Create enterprise stub for fork pull requests
        if: env.FORK_PR == 'true'
        run: |
          mkdir -p enterprise
          cat > enterprise/go.mod << 'EOF'
          module github.com/TykTechnologies/ai-studio-enterprise/v2

          go 1.26.5
          EOF

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Create placeholders for embeds
        run: |
          mkdir -p docs/site/dist ui/admin-frontend/build
          echo "placeholder" > docs/site/dist/index.html
          echo "placeholder" > ui/admin-frontend/build/index.html

      - name: Verify the gorm copy
        env:
          CE_ONLY: ${{ env.FORK_PR == 'true' && '1' || '' }}
        run: make gorm-verify

      - name: Verify nothing uses upstream langchaingo
        env:
          CE_ONLY: ${{ env.FORK_PR == 'true' && '1' || '' }}
        run: make langchaingo-verify

      - name: Check no public package imports the enterprise module
        run: make enterprise-import-guard

      - name: Check the control plane logs only through the logger package
        run: make logging-guard

      # Plugin modules replace midsommar/v2 with this tree, so a root go.mod
      # raise must be followed there or `go build` stops at "updates to go.mod
      # needed" (make plugins, plugin-publish, the dev watcher). The
      # community and tyk-internal plugins live in their own repositories and
      # are not checked here; fork pull requests have no enterprise/plugins,
      # which the script skips.
      - name: Check in-repo plugin modules are tidy
        env:
          PLUGIN_MOD_ROOTS: examples enterprise/plugins
        run: make plugins-mod-check

  # ==========================================================================
  # Module zip check: the committed tree must make a module zip the Go proxy
  # accepts, or nobody can `go get` Studio (see tools/modcheck)
  # ==========================================================================
  module-check:
    needs: [dep-guard]
    name: Module Zip Check
    runs-on: warp-ubuntu-latest-arm64-2x
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tools/modcheck/go.mod
          cache-dependency-path: tools/modcheck/go.sum

      - name: Check the module zip
        run: make module-check

  # ==========================================================================
  # Host compatibility: the Tyk Dashboard and MDCB embed pkg/studio. Studio
  # must not raise a host's dependency versions (outside that host's reasoned
  # allowlist) and must build inside its module graph with CGO_ENABLED=0.
  # Reads the hosts' private go.mod at run time, so never on forks.
  # ==========================================================================
  host-compat:
    needs: [dep-guard]
    name: Host Compatibility (${{ matrix.name }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: warp-ubuntu-latest-arm64-4x
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Dashboard
            repo: tyk-analytics
          - name: MDCB
            repo: tyk-sink
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
          token: ${{ secrets.CI_SUBMODULE_PAT }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Credentials for private Tyk modules
        run: git config --global url."https://x-access-token:${{ secrets.CI_SUBMODULE_PAT }}@github.com/TykTechnologies/".insteadOf "https://github.com/TykTechnologies/"

      - name: Check Studio against the ${{ matrix.name }}'s go.mod
        env:
          GH_TOKEN: ${{ secrets.CI_SUBMODULE_PAT }}
          GOPRIVATE: github.com/TykTechnologies
        run: make host-compat HOST_REPOS=${{ matrix.repo }}

  # ==========================================================================
  # Documentation Build
  # ==========================================================================
  docs-build:
    needs: [dep-guard]
    name: Documentation Build
    runs-on: warp-ubuntu-latest-arm64-2x
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "docs/site/package-lock.json"

      - name: Cache VitePress
        uses: WarpBuilds/cache@f643a1ba29942d56621d07fc2d4284c7219868ad # v1
        with:
          path: docs/site/.vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('docs/site/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-

      - name: Build Documentation
        run: |
          cp .env.example .env
          cd docs/site
          npm ci --ignore-scripts
          npm rebuild
          NODE_ENV=production npm run docs:build

  # ==========================================================================
  # Test Summary
  # ==========================================================================
  test-summary:
    name: Test Summary
    runs-on: warp-ubuntu-latest-arm64-2x
    needs: [frontend-tests, go-unit-tests, go-postgres-tests, gorm-verify, module-check, host-compat, docs-build]
    if: always()
    steps:
      - name: Download Coverage Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-*
          merge-multiple: true
        continue-on-error: true

      - name: Generate Summary
        run: |
          echo "# CI Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests | ${{ needs.frontend-tests.result == 'success' && ':white_check_mark:' || ':x:' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Go Unit Tests (CE) | ${{ contains(needs.go-unit-tests.result, 'success') && ':white_check_mark:' || ':x:' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Go Unit Tests (ENT) | ${{ env.FORK_PR == 'true' && ':fast_forward:' || (contains(needs.go-unit-tests.result, 'success') && ':white_check_mark:' || ':x:') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Go Postgres Tests | ${{ needs.go-postgres-tests.result == 'success' && ':white_check_mark:' || ':x:' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| gorm Copy Verification | ${{ needs.gorm-verify.result == 'success' && ':white_check_mark:' || ':x:' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Module Zip Check | ${{ needs.module-check.result == 'success' && ':white_check_mark:' || ':x:' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Host Compatibility (Dashboard, MDCB) | ${{ needs.host-compat.result == 'success' && ':white_check_mark:' || (needs.host-compat.result == 'skipped' && ':fast_forward:' || ':x:') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation Build | ${{ needs.docs-build.result == 'success' && ':white_check_mark:' || ':x:' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$FORK_PR" = true ]; then
            echo "Pull request from a fork: the enterprise checks did not run. A maintainer runs them before merging (see CONTRIBUTING.md)." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "Coverage files:" >> $GITHUB_STEP_SUMMARY
          ls -la coverage-*.out 2>/dev/null || echo "No coverage files found"

      - name: Upload Combined Coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-combined
          path: coverage-*.out
          retention-days: 30
        continue-on-error: true

      - name: Check Results
        if: needs.frontend-tests.result != 'success' || needs.go-unit-tests.result != 'success' || needs.go-postgres-tests.result != 'success' || needs.gorm-verify.result != 'success'
        run: |
          echo "Some tests failed!"
          exit 1
