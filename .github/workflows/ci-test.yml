name: CI Tests

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
  push:
    branches:
      - main
  # A full run on any branch: every test re-runs and coverage is collected.
  # Use it on a pull request to bypass the test cache.
  workflow_dispatch:
    inputs:
      mode:
        description: "pr: incremental (Go test cache, no coverage). full: every test re-runs, with coverage."
        type: choice
        options: [full, pr]
        default: full
  # The release gate (release-gate.yml) runs this workflow in full mode.
  workflow_call:
    inputs:
      mode:
        type: string
        default: full

permissions:
  contents: read

# A new push to a pull request cancels its running checks; pushes to main
# and full runs are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Only the enterprise module is private; every other TykTechnologies module
  # (tyk-identity-broker, storage, ...) is public and comes through the proxy.
  # (Fetching those with git broke CI when a cached clone missed a new tag.)
  GOPRIVATE: github.com/TykTechnologies/ai-studio-enterprise
  # GitHub gives pull requests from forks no secrets, so they cannot check
  # out the private enterprise submodule. They run the Community Edition
  # checks only; a maintainer runs the rest by pushing the branch into this
  # repository (see CONTRIBUTING.md). The go-unit-tests matrix repeats this
  # expression, because env is not available there.
  FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
  # pr: pull requests and pushes to main. Go reuses cached test results for
  # packages whose code and test inputs are unchanged (see
  # scripts/stamp-mtimes.sh), and no coverage is collected.
  # full: manual runs and the release gate. Every test re-runs (-count=1)
  # and coverage is collected.
  MODE: ${{ inputs.mode || 'pr' }}

jobs:
  # ==========================================================================
  # Dependency Guard: a pull request that changes a dependency manifest
  # fails here until a reviewer has checked the change and added the
  # deps-reviewed label. Nothing else runs before it passes, so new
  # dependency code never runs with this repository's secrets unreviewed.
  # Outside pull requests it has nothing to compare, so it is skipped.
  # ==========================================================================
  dep-guard:
    if: github.event_name == 'pull_request'
    uses: TykTechnologies/github-actions/.github/workflows/dependency-guard.yml@9bf72299cb922a5f91ad1c3c1654a0ada7c468ae  # main (2026-10-12)
    permissions:
      contents: read
    with:
      # The defaults only cover the root manifests; the nested Go modules
      # (microgateway, plugins, tools) and npm projects (admin UI, docs,
      # tests) are dependencies just the same. :(glob) keeps the guard's
      # unquoted loop from expanding the pattern itself, and makes ** match
      # at any depth.
      extra_paths: ":(glob)**/go.mod :(glob)**/go.sum :(glob)**/package.json :(glob)**/package-lock.json"

  # ==========================================================================
  # Changes: which parts of the tree a pull request touches. Jobs whose
  # inputs did not change are skipped; CI Gate counts a skipped job as
  # passed. Everything runs on pushes, manual runs and in full mode.
  # ==========================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.classify.outputs.go }}
      frontend: ${{ steps.classify.outputs.frontend }}
    steps:
      # The pull_request checkout is the merge commit, so its first parent is
      # the base branch and the diff between them is the pull request.
      - name: Checkout
        if: github.event_name == 'pull_request' && env.MODE != 'full'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      # Go jobs are skipped only when every changed file is known not to
      # affect Go: the admin UI, the docs site, feature specs, read/ and
      # top-level Markdown. Anything else, including an enterprise pointer
      # bump, a workflow, the Makefile or a script, runs them.
      - name: Classify changed files
        id: classify
        run: |
          if [ "${{ github.event_name }}" != pull_request ] || [ "$MODE" = full ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail safe: if the diff cannot be read, run everything.
          if ! files=$(git diff --name-only HEAD^1 HEAD); then
            echo "::warning::Could not list the changed files; running every job."
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          go=false
          frontend=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              ui/*) frontend=true ;;
              # Its OTel attribute tables are generated from the enterprise
              # mapping and checked by make agent-tracing-docs-verify.
              docs/site/docs/agent-tracing.md) go=true ;;
              docs/* | features/* | read/*) ;;
              */*) go=true ;;
              *.md) ;;
              *) go=true ;;
            esac
            case "$f" in
              .github/*) frontend=true ;;
              # Filter script templates are run by scripting/filter_templates_test.go.
              ui/admin-frontend/src/admin/components/filters/ScriptTemplateSelector.js) go=true ;;
            esac
          done <<< "$files"
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Go jobs: $go, frontend jobs: $frontend" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # Go Linting (disabled for now)
  # ==========================================================================
  golangci-lint:
    if: false
    runs-on: warp-ubuntu-latest-arm64-4x
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - name: Fetch base branch
        if: ${{ github.event_name == 'pull_request' }}
        run: git fetch origin ${{ github.base_ref }}

      - name: golangci-lint
        if: ${{ github.event_name == 'pull_request' }}
        uses: golangci/golangci-lint-action@3a919529898de77ec3da873e3063ca4b10e7f5cc # v3
        with:
          version: latest
          args: --out-format=checkstyle:golanglint.xml --timeout=600s --max-issues-per-linter=0 --max-same-issues=0 --new-from-rev=origin/${{ github.base_ref }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golangcilint
          retention-days: 1
          path: |
            golanglint.xml

  # ==========================================================================
  # Frontend Tests (Jest)
  # ==========================================================================
  frontend-tests:
    needs: [dep-guard, changes]
    # Runs when dep-guard passed or was skipped (outside pull requests).
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.frontend == 'true' }}
    name: Frontend Tests
    runs-on: warp-ubuntu-latest-arm64-2x
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install and Test Frontend
        env:
          CI: true
        run: |
          cd ui/admin-frontend
          npm ci --ignore-scripts
          npm rebuild
          npm test -- --forceExit

      - name: Build Frontend
        run: |
          cd ui/admin-frontend
          CI=false npm run build

  # ==========================================================================
  # Go Unit Tests (Studio + Microgateway + Enterprise) - Matrix for CE/ENT
  #
  # Caching: one cache of the build and module caches per edition. Pull
  # requests only restore it; pushes to main save a fresh one, so pull
  # requests start from the latest main. In pr mode it also holds main's
  # test results, and packages whose code and test inputs are unchanged are
  # reported as "(cached)" instead of re-running. setup-go's own cache is off:
  # it stored the same directories a second time.
  # ==========================================================================
  go-unit-tests:
    needs: [dep-guard, changes]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.go == 'true' }}
    name: Go Unit Tests (${{ matrix.edition }})
    runs-on: warp-ubuntu-latest-arm64-4x
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Fork pull requests run CE only (see FORK_PR above).
        edition: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ce"]' || '["ce", "ent"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
          submodules: ${{ matrix.edition == 'ent' }}
          token: ${{ secrets.CI_SUBMODULE_PAT || github.token }}

      - name: Create enterprise stub for CE builds
        if: matrix.edition == 'ce'
        run: |
          mkdir -p enterprise
          cat > enterprise/go.mod << 'EOF'
          module github.com/TykTechnologies/ai-studio-enterprise/v2

          go 1.26.5
          EOF

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go cache
        uses: WarpBuilds/cache/restore@f643a1ba29942d56621d07fc2d4284c7219868ad # v1
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-gotest-${{ matrix.edition }}-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-gotest-${{ matrix.edition }}-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-gotest-${{ matrix.edition }}-

      - name: Go cache size
        run: du -sh ~/.cache/go-build ~/go/pkg/mod 2>/dev/null || true

      - name: Set test flags
        id: flags
        run: |
          if [ "${{ matrix.edition }}" == "ent" ]; then
            echo "BUILD_TAGS=-tags enterprise" >> $GITHUB_OUTPUT
          else
            echo "BUILD_TAGS=" >> $GITHUB_OUTPUT
          fi
          # The flags are part of Go's test cache key: pr mode must use the
          # same flags on pull requests and on main, or nothing is reused.
          if [ "$MODE" = full ]; then
            echo "FULL=-count=1 -covermode=atomic" >> $GITHUB_OUTPUT
          else
            echo "FULL=" >> $GITHUB_OUTPUT
          fi

      - name: Verify Go dependencies
        run: |
          go mod verify
          cd microgateway && go mod verify

      - name: Create placeholders for embeds
        run: |
          # Create placeholder for docs embed (tests don't need actual docs)
          mkdir -p docs/site/dist
          echo "placeholder" > docs/site/dist/index.html
          # Create placeholder for frontend embed (tests don't need actual frontend)
          mkdir -p ui/admin-frontend/build
          echo "placeholder" > ui/admin-frontend/build/index.html
          # Use dev environment template for tests
          cp dev/.env.dev .env

      # Enterprise tests of core packages live in the enterprise repository
      # (enterprise/_coretests) and are linked into their packages here.
      - name: Link enterprise tests of core packages
        if: matrix.edition == 'ent'
        run: make ent-link

      # After everything that writes into the tree: give each file an mtime
      # derived from its content, so cached test results survive the fresh
      # checkout (see the script).
      - name: Stamp file times for the Go test cache
        run: |
          scripts/stamp-mtimes.sh .env docs/site/dist/index.html \
            ui/admin-frontend/build/index.html \
            ${{ matrix.edition == 'ce' && 'enterprise/go.mod' || '' }}

      # go vet over our own code; third_party/ (the vendored gorm) is left
      # out, see third_party/README.md. The ent edition also vets the
      # enterprise module.
      - name: Go vet
        run: scripts/vet.sh ${{ matrix.edition }}

      # A host embedding pkg/studio may build without cgo (the Dashboard's dev
      # builds do), so pkg/studio must compile with CGO_ENABLED=0.
      - name: Build pkg/studio without cgo
        run: |
          CGO_ENABLED=0 go build -o /dev/null \
            -tags "studio_noui ${{ matrix.edition == 'ent' && 'enterprise' || '' }}" ./pkg/studio/...

      - name: Run AI Studio Unit Tests
        run: |
          go test ${{ steps.flags.outputs.BUILD_TAGS }} -v -race -short \
            ${{ steps.flags.outputs.FULL }} \
            ${{ env.MODE == 'full' && format('-coverprofile=coverage-studio-{0}.out', matrix.edition) || '' }} \
            ./...

      - name: Run Microgateway Unit Tests
        run: |
          cd microgateway
          go test ${{ steps.flags.outputs.BUILD_TAGS }} -v -race -short \
            ${{ steps.flags.outputs.FULL }} \
            ${{ env.MODE == 'full' && format('-coverprofile=../coverage-microgateway-{0}.out', matrix.edition) || '' }} \
            ./...

      # The enterprise module's own packages (features/, scripting/, ...).
      # Its Postgres-gated tests skip here and run in go-postgres-tests.
      - name: Run Enterprise Module Unit Tests
        if: matrix.edition == 'ent'
        working-directory: enterprise
        run: |
          go test -tags enterprise -v -race -short \
            ${{ steps.flags.outputs.FULL }} \
            ${{ env.MODE == 'full' && '-coverprofile=../coverage-enterprise-ent.out' || '' }} \
            ./...

      - name: Upload Coverage
        if: env.MODE == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.edition }}
          path: coverage-*.out
          retention-days: 7

      # Saved even when a test failed: the build cache is still good, and Go
      # never caches a failing result.
      - name: Save Go cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.MODE == 'pr' }}
        uses: WarpBuilds/cache/save@f643a1ba29942d56621d07fc2d4284c7219868ad # v1
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-gotest-${{ matrix.edition }}-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}

  # ==========================================================================
  # Go Postgres Tests: the tests that need a real PostgreSQL (SQLite hides
  # multi-connection behaviour: advisory locks, concurrent find-or-create,
  # transaction deadlocks, dialect-specific SQL). They skip without
  # DATABASE_URL, so the unit jobs above never run them.
  #
  # They talk to a live database, so they always re-run (-count=1); the job
  # restores the CE unit-test cache for its compiled packages and saves none
  # of its own.
  # ==========================================================================
  go-postgres-tests:
    needs: [dep-guard, changes]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.go == 'true' }}
    name: Go Postgres Tests
    runs-on: warp-ubuntu-latest-arm64-4x
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: midsommar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/midsommar_test?sslmode=disable
    steps:
      # The enterprise submodule is checked out for the audit suite below;
      # the other packages are built without the enterprise tag. Fork pull
      # requests get a stub instead and skip the audit suite.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
          submodules: ${{ env.FORK_PR != 'true' }}
          token: ${{ secrets.CI_SUBMODULE_PAT || github.token }}

      - name: Create enterprise stub for fork pull requests
        if: env.FORK_PR == 'true'
        run: |
          mkdir -p enterprise
          cat > enterprise/go.mod << 'EOF'
          module github.com/TykTechnologies/ai-studio-enterprise/v2

          go 1.26.5
          EOF

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go cache
        uses: WarpBuilds/cache/restore@f643a1ba29942d56621d07fc2d4284c7219868ad # v1
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-gotest-ce-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-gotest-ce-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-gotest-ce-

      - name: Create placeholders for embeds
        run: |
          mkdir -p docs/site/dist ui/admin-frontend/build
          echo "placeholder" > docs/site/dist/index.html
          echo "placeholder" > ui/admin-frontend/build/index.html
          cp dev/.env.dev .env

      # One package at a time (-p 1): the packages share the database, and
      # tests that are not schema-isolated would otherwise migrate it at once.
      - name: Run Postgres tests
        run: |
          go test -v -race -p 1 -count=1 \
            -run 'PostgreSQL|_Postgres|InTransaction|EnsureInDefaultCatalogue' \
            ./models/ ./services/ ./pkg/studio/ ./analytics/

      # Packages whose Postgres-gated tests used to run nowhere: the chat
      # queue (LISTEN/NOTIFY), config and startup.
      - name: Run chat queue, config and startup Postgres tests
        run: |
          go test -v -race -p 1 -count=1 ./chat_session/ ./config/ ./startup/

      # The cluster code runs on every Postgres deployment: the event log and
      # node registry, the shared LISTEN connection, durable pushes and the
      # leader lease. Each test works in a schema of its own; the push and
      # lease tests run their SQLite and Postgres cases side by side.
      - name: Run cluster Postgres tests
        run: |
          go test -v -race -p 1 -count=1 \
            ./pkg/cluster/ ./pkg/pglisten/ ./services/pushes/ ./services/scheduler/

      # The edge, the enterprise audit suite and the budget tracker test get
      # databases of their own: the edge schema has its own apps/llms tables,
      # and the budget test drops and recreates the tables it uses.
      - name: Create edge, audit and budget databases
        run: |
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE mgw_test'
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE audit_test'
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE budget_test'

      # Pushes and the event-bus relay across several control-server replicas
      # on one database, and the budget usage tracker's queries.
      - name: Run gRPC push, relay and budget Postgres tests
        env:
          BUDGET_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/budget_test?sslmode=disable
        run: |
          go test -v -race -count=1 -run 'TestPushCluster_|TestRelay_|_Postgres' ./grpc/

      # Analytics writer, budget ledger and budget sync against Postgres
      # (ON CONFLICT, GREATEST, enforced foreign keys), and the edge schema
      # snapshot.
      - name: Run microgateway Postgres tests
        working-directory: microgateway
        env:
          MGW_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/mgw_test?sslmode=disable
        run: |
          go test -v -race -count=1 -run 'Postgres' ./internal/services/ ./internal/database/

      # Real edges against several Studio replicas sharing DATABASE_URL (a
      # schema per test): pushes land whatever happens to the connections.
      - name: Run microgateway cluster Postgres tests
        working-directory: microgateway
        run: |
          go test -v -race -count=1 ./tests/cluster/

      # Agent Call Tracing on Postgres, in a database of its own: the store
      # and capture staging in core, and the enterprise assembler,
      # correlation goldens, JSON v1 and content API (purge). Their gates
      # read DATABASE_URL or AGENT_TRACE_TEST_POSTGRES_DSN, so both are set.
      # A Postgres-only bug (jyx.126) must not pass by skipping.
      - name: Run agent tracing Postgres tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/agenttrace_test?sslmode=disable
          AGENT_TRACE_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/agenttrace_test?sslmode=disable
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE agenttrace_test'
          go test -v -race -p 1 -count=1 -run 'AgentTrace|Capture' ./models/ ./analytics/

      - name: Run enterprise agent tracing Postgres tests
        if: env.FORK_PR != 'true'
        working-directory: enterprise
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/agenttrace_test?sslmode=disable
          AGENT_TRACE_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/agenttrace_test?sslmode=disable
        run: |
          go test -tags enterprise -v -race -p 1 -count=1 ./features/agenttracing/...

      - name: Run enterprise audit and webhooks Postgres tests
        if: env.FORK_PR != 'true'
        working-directory: enterprise
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/audit_test?sslmode=disable
        run: |
          go test -tags enterprise -v -race -count=1 ./features/audit/...
          go test -tags enterprise -v -race -count=1 -run '_Postgres' ./features/webhooks/

  # ==========================================================================
  # gorm copy: third_party/gorm.io is exactly what third_party/gorm-pin
  # produces, and no module imports gorm.io (see third_party/README.md)
  # ==========================================================================
  gorm-verify:
    needs: [dep-guard, changes]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.go == 'true' }}
    name: gorm Copy Verification
    runs-on: warp-ubuntu-latest-arm64-2x
    timeout-minutes: 15
    steps:
      # The enterprise module is part of the import check. Fork pull requests
      # check the root and microgateway modules in the CE edition only.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: ${{ env.FORK_PR != 'true' }}
          token: ${{ secrets.CI_SUBMODULE_PAT || github.token }}

      - name: Create enterprise stub for fork pull requests
        if: env.FORK_PR == 'true'
        run: |
          mkdir -p enterprise
          cat > enterprise/go.mod << 'EOF'
          module github.com/TykTechnologies/ai-studio-enterprise/v2

          go 1.26.5
          EOF

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Create placeholders for embeds
        run: |
          mkdir -p docs/site/dist ui/admin-frontend/build
          echo "placeholder" > docs/site/dist/index.html
          echo "placeholder" > ui/admin-frontend/build/index.html

      - name: Verify the gorm copy
        env:
          CE_ONLY: ${{ env.FORK_PR == 'true' && '1' || '' }}
        run: make gorm-verify

      - name: Verify nothing uses upstream langchaingo
        env:
          CE_ONLY: ${{ env.FORK_PR == 'true' && '1' || '' }}
        run: make langchaingo-verify

      - name: Check no public package imports the enterprise module
        run: make enterprise-import-guard

      - name: Check the control plane logs only through the logger package
        run: make logging-guard

      # The Agent Call Tracing operator guide's OTel attribute tables are
      # generated from the enterprise mapping profile.
      - name: Check the agent tracing OTel attribute tables are current
        if: env.FORK_PR != 'true'
        run: make agent-tracing-docs-verify

      # Plugin modules replace midsommar/v2 with this tree, so a root go.mod
      # raise must be followed there or `go build` stops at "updates to go.mod
      # needed" (make plugins, plugin-publish, the dev watcher). The
      # community and tyk-internal plugins live in their own repositories and
      # are not checked here; fork pull requests have no enterprise/plugins,
      # which the script skips.
      - name: Check in-repo plugin modules are tidy
        env:
          PLUGIN_MOD_ROOTS: examples enterprise/plugins
        run: make plugins-mod-check

  # ==========================================================================
  # Module zip check: the committed tree must make a module zip the Go proxy
  # accepts, or nobody can `go get` Studio (see tools/modcheck)
  # ==========================================================================
  module-check:
    needs: [dep-guard, changes]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.go == 'true' }}
    name: Module Zip Check
    runs-on: warp-ubuntu-latest-arm64-2x
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tools/modcheck/go.mod
          cache-dependency-path: tools/modcheck/go.sum

      - name: Check the module zip
        run: make module-check

  # ==========================================================================
  # Host compatibility: the Tyk Dashboard and MDCB embed pkg/studio. Studio
  # must not raise a host's dependency versions (outside that host's reasoned
  # allowlist) and must build inside its module graph with CGO_ENABLED=0.
  # Reads the hosts' private go.mod at run time, so never on forks.
  # ==========================================================================
  host-compat:
    needs: [dep-guard, changes]
    name: Host Compatibility (${{ matrix.name }})
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.go == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: warp-ubuntu-latest-arm64-4x
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Dashboard
            repo: tyk-analytics
          - name: MDCB
            repo: tyk-sink
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
          token: ${{ secrets.CI_SUBMODULE_PAT }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Credentials for private Tyk modules
        run: git config --global url."https://x-access-token:${{ secrets.CI_SUBMODULE_PAT }}@github.com/TykTechnologies/".insteadOf "https://github.com/TykTechnologies/"

      - name: Check Studio against the ${{ matrix.name }}'s go.mod
        env:
          GH_TOKEN: ${{ secrets.CI_SUBMODULE_PAT }}
          GOPRIVATE: github.com/TykTechnologies
        run: make host-compat HOST_REPOS=${{ matrix.repo }}

  # ==========================================================================
  # Documentation Build (cheap, and the site may read files outside docs/,
  # so it is not path-filtered)
  # ==========================================================================
  docs-build:
    needs: [dep-guard]
    if: ${{ !cancelled() && !failure() }}
    name: Documentation Build
    runs-on: warp-ubuntu-latest-arm64-2x
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "docs/site/package-lock.json"

      - name: Cache VitePress
        uses: WarpBuilds/cache@f643a1ba29942d56621d07fc2d4284c7219868ad # v1
        with:
          path: docs/site/.vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('docs/site/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-

      - name: Build Documentation
        run: |
          cp .env.example .env
          cd docs/site
          npm ci --ignore-scripts
          npm rebuild
          NODE_ENV=production npm run docs:build

  # ==========================================================================
  # CI Gate: the one check a branch ruleset needs to require. Fails when the
  # dependency guard fails or any gating job fails or is cancelled; a job
  # skipped because its inputs did not change counts as passed.
  # ==========================================================================
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [dep-guard, changes, frontend-tests, go-unit-tests, go-postgres-tests, gorm-verify, module-check, host-compat, docs-build]
    if: always()
    steps:
      - name: Download Coverage Artifacts
        if: env.MODE == 'full'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-*
          merge-multiple: true
        continue-on-error: true

      - name: Generate Summary
        env:
          RESULTS: |
            Dependency Guard=${{ needs.dep-guard.result }}
            Detect Changes=${{ needs.changes.result }}
            Frontend Tests=${{ needs.frontend-tests.result }}
            Go Unit Tests=${{ needs.go-unit-tests.result }}
            Go Postgres Tests=${{ needs.go-postgres-tests.result }}
            gorm Copy Verification=${{ needs.gorm-verify.result }}
            Module Zip Check=${{ needs.module-check.result }}
            Host Compatibility=${{ needs.host-compat.result }}
            Documentation Build=${{ needs.docs-build.result }}
        run: |
          {
            echo "# CI Test Summary ($MODE mode)"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            while IFS='=' read -r job result; do
              [ -n "$job" ] || continue
              case "$result" in
                success) icon=':white_check_mark:' ;;
                skipped) icon=':fast_forward: skipped' ;;
                *) icon=":x: $result" ;;
              esac
              echo "| $job | $icon |"
            done <<< "$RESULTS"
            echo ""
            if [ "$FORK_PR" = true ]; then
              echo "Pull request from a fork: the enterprise checks did not run. A maintainer runs them before merging (see CONTRIBUTING.md)."
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la coverage-*.out 2>/dev/null || echo "No coverage files"

      - name: Upload Combined Coverage
        if: env.MODE == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-combined
          path: coverage-*.out
          retention-days: 30
        continue-on-error: true

      # Module zip, host compatibility and the docs build report as checks of
      # their own but do not fail the gate.
      - name: Check Results
        if: >-
          !contains(fromJSON('["success","skipped"]'), needs.dep-guard.result) ||
          needs.changes.result != 'success' ||
          !contains(fromJSON('["success","skipped"]'), needs.frontend-tests.result) ||
          !contains(fromJSON('["success","skipped"]'), needs.go-unit-tests.result) ||
          !contains(fromJSON('["success","skipped"]'), needs.go-postgres-tests.result) ||
          !contains(fromJSON('["success","skipped"]'), needs.gorm-verify.result)
        run: |
          echo "Some checks failed!"
          exit 1
