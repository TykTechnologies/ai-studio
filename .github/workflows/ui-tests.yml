name: UI E2E Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches:
      - main
      - release-**
      - QA-**
  workflow_dispatch:
  # Release tags are covered by the release gate (release-gate.yml), which
  # calls this workflow before release.yml publishes anything.
  workflow_call:

permissions:
  contents: read

env:
  # Only the enterprise module is private; every other TykTechnologies module
  # (tyk-identity-broker, storage, ...) is public and comes through the proxy.
  # (Fetching those with git broke CI when a cached clone missed a new tag.)
  GOPRIVATE: github.com/TykTechnologies/ai-studio-enterprise

jobs:
  ui-e2e-tests:
    name: UI E2E Tests
    # The suite runs the enterprise build, and fork pull requests get no
    # secrets to check out the private enterprise submodule (see CONTRIBUTING.md).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
          token: ${{ secrets.CI_SUBMODULE_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      # The suite drives the React dev server (frontend service, :3000), not
      # the UI embedded in the Go binary, so the binary only needs something
      # to embed. The public/ assets give it index.html and the logos the
      # backend serves itself (/logos, the default branding logo). The
      # production build is checked by ci-test.yml's Frontend Tests job; it
      # took 2 to 3 minutes here.
      - name: Create frontend embed placeholder
        run: |
          mkdir -p ui/admin-frontend/build
          cp -R ui/admin-frontend/public/. ui/admin-frontend/build/

      # The studio container compiles the enterprise binary and the
      # asset-catalog plugin on start. Cold, that took about 4 minutes of
      # "Wait for AI Studio" (issue #147). Its Go module and build caches are
      # bind-mounted from here (STUDIO_GOMODCACHE / STUDIO_GOCACHE in
      # tests/compose.yml), and so is the frontend container's npm cache.
      # Pull requests only restore; pushes to main save, like ci-test.yml.
      # Release tags and the nightly Release Gate stay cold.
      - name: Prepare container caches
        run: |
          mkdir -p "$RUNNER_TEMP/studio-gomod" "$RUNNER_TEMP/studio-gobuild" "$RUNNER_TEMP/frontend-npm"
          echo "STUDIO_GOMODCACHE=$RUNNER_TEMP/studio-gomod" >> "$GITHUB_ENV"
          echo "STUDIO_GOCACHE=$RUNNER_TEMP/studio-gobuild" >> "$GITHUB_ENV"
          echo "FRONTEND_NPM_CACHE=$RUNNER_TEMP/frontend-npm" >> "$GITHUB_ENV"

      - name: Restore container caches
        id: container-cache
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/studio-gomod
            ${{ runner.temp }}/studio-gobuild
            ${{ runner.temp }}/frontend-npm
          key: ${{ runner.os }}-ui-e2e-containers-${{ hashFiles('go.sum', 'enterprise/go.sum', 'ui/admin-frontend/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ui-e2e-containers-${{ hashFiles('go.sum', 'enterprise/go.sum', 'ui/admin-frontend/package-lock.json') }}-
            ${{ runner.os }}-ui-e2e-containers-

      - name: Create docs placeholder
        run: |
          # Create placeholder for docs embed (docs aren't needed for UI tests)
          mkdir -p docs/site/dist
          echo "placeholder" > docs/site/dist/index.html

      - name: Clean test database
        run: |
          # Ensure fresh database for each test run
          rm -rf tests/postgres_data_ci || true
          docker compose -f tests/compose.yml down -v --remove-orphans 2>/dev/null || true

      - name: Start Test Environment
        env:
          TYK_AI_LICENSE: ${{ secrets.TYK_AI_LICENSE }}
          TYK_AI_SECRET_KEY: ${{ secrets.TYK_AI_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_KEY }}
          ANTHROPIC_AI_KEY: ${{ secrets.ANTHROPIC_KEY }}
          GO_BUILD_FLAGS: "-buildvcs=false"
          BUILD_EDITION: enterprise
        run: |
          docker compose -f tests/compose.yml up -d

      - name: Install Playwright
        working-directory: tests/ui
        run: |
          npm ci --ignore-scripts
          npm rebuild
          npx playwright install --with-deps chromium

      - name: Wait for AI Studio
        run: |
          echo "Waiting for AI Studio backend to start..."
          started=$(date +%s)
          attempts=0
          max_attempts=60
          # Check the backend directly on port 8081 (the container's 8080).
          # An authenticated endpoint answers 401 once the API is up.
          while [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/common/api/v1/notifications/unread/count)" != "401" ]; do
            attempts=$((attempts+1))
            # A failed build exits the container; don't wait out the timeout.
            if [ -n "$(docker compose -f tests/compose.yml ps -q --status exited studio)" ]; then
              echo "The studio container exited before the API came up."
              docker compose -f tests/compose.yml logs --tail=200 studio
              exit 1
            fi
            echo "Attempt $attempts/$max_attempts - Waiting for AI Studio backend..."
            if [ $attempts -ge $max_attempts ]; then
              echo "Timed out after $max_attempts attempts. AI Studio failed to start."
              echo "Docker container status:"
              docker compose -f tests/compose.yml ps
              echo "Docker logs:"
              docker compose -f tests/compose.yml logs --tail=200
              exit 1
            fi
            sleep 5
          done
          echo "AI Studio backend is ready (waited $(( $(date +%s) - started ))s)"

          # The Playwright suite drives the React dev server on :3000
          # (tests/ui/config.ts default), so wait for that to compile too.
          echo "Waiting for frontend dev server..."
          attempts=0
          while [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000)" != "200" ]; do
            attempts=$((attempts+1))
            echo "Attempt $attempts/$max_attempts - Waiting for frontend..."
            if [ $attempts -ge $max_attempts ]; then
              echo "Timed out waiting for frontend."
              docker compose -f tests/compose.yml logs --tail=200 frontend
              exit 1
            fi
            sleep 5
          done
          echo "Frontend is ready (waited $(( $(date +%s) - started ))s in total)"

      - name: Debug UI Response
        run: |
          echo "=== Checking UI response ==="
          echo "Login page response code:"
          curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/login
          echo ""
          echo "Login page HTML (first 500 chars):"
          curl -s http://localhost:8081/login | head -c 500
          echo ""
          echo "=== Checking for React app root ==="
          curl -s http://localhost:8081/login | grep -o '<div id="root"' || echo "React root not found!"

      - name: Run Playwright Tests
        id: playwright
        working-directory: tests/ui
        env:
          BOOTSTRAP_ADMIN_EMAIL: admin@tyk.io
          BOOTSTRAP_ADMIN_PASSWORD: Admin#2025
          # Agent tracing live capture: the gateway, and the runner's mock
          # LLM upstream as the studio container sees it.
          TEST_PROXY_URL: http://localhost:9090
          TEST_MOCK_UPSTREAM_HOST: host.docker.internal
          DEBUG: pw:api
          PWDEBUG: 0
        run: npx playwright test --project='chromium' --reporter=list --reporter=html --timeout=60000

      # Saved even when a test failed: the caches only hold build inputs.
      - name: Save container caches
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/studio-gomod
            ${{ runner.temp }}/studio-gobuild
            ${{ runner.temp }}/frontend-npm
          # The restore step's key: the container's go mod tidy writes a
          # gitignored plugin go.sum, so hashing again here could differ.
          key: ${{ steps.container-cache.outputs.cache-primary-key }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: tests/ui/playwright-report/
          retention-days: 7

      # TODO: Re-enable S3 upload after fixing test environment
      # - name: Upload Test Results to S3
      #   if: failure() && steps.playwright.outcome != 'success'
      #   working-directory: tests/ui
      #   env:
      #     AWS_ACCESS_KEY_ID: ${{ secrets.UI_AWS_ACCESS_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.UI_AWS_SECRET_ACCESS_KEY }}
      #     RUN_ID: 'midsommar/${{ github.run_id }}'
      #   run: npm run upload_report_to_s3

      # - name: Add S3 Report Link to Summary
      #   if: failure() && steps.playwright.outcome != 'success'
      #   run: |
      #     echo "# UI Test Report" >> $GITHUB_STEP_SUMMARY
      #     echo "" >> $GITHUB_STEP_SUMMARY
      #     echo "- Status: :x: Failed" >> $GITHUB_STEP_SUMMARY
      #     echo "- [View Report on S3](https://tyk-qa-reports.s3.eu-central-1.amazonaws.com/midsommar/${{ github.run_id }}/index.html)" >> $GITHUB_STEP_SUMMARY

      - name: Collect Docker Logs
        if: failure()
        run: |
          echo "Collecting Docker logs..."
          docker compose -f tests/compose.yml logs > docker-compose.log 2>&1

      - name: Upload Docker Logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: docker-compose-logs
          path: docker-compose.log
          retention-days: 3

      - name: Cleanup
        if: always()
        run: |
          echo "Stopping test environment..."
          docker compose -f tests/compose.yml down -v --remove-orphans
          echo "Cleanup complete"
