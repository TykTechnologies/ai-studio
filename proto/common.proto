syntax = "proto3";

package microgateway;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/TykTechnologies/midsommar/v2/proto";

// Common data structures for hub-and-spoke configuration synchronization

// LLMConfig represents an LLM configuration with embedded relationships
message LLMConfig {
  uint32 id = 1;
  string name = 2;
  string slug = 3;
  string vendor = 4;
  string endpoint = 5;
  string api_key_encrypted = 6;
  string default_model = 7;
  int32 max_tokens = 8;
  int32 timeout_seconds = 9;
  int32 retry_count = 10;
  bool is_active = 11;
  double monthly_budget = 12;
  int32 rate_limit_rpm = 13;
  string metadata = 14; // JSON string
  string allowed_models = 15; // JSON string
  string auth_mechanism = 16;
  string auth_config = 17; // JSON string
  string namespace = 18; // Namespace for filtering
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
  
  // Embedded relationship data (from join tables)
  repeated uint32 app_ids = 21;     // From app_llms join table
  repeated uint32 filter_ids = 22;  // From llm_filters join table  
  repeated uint32 plugin_ids = 23;  // From llm_plugins join table
  bool dont_log_bodies = 24;        // When true, suppress request/response body logging
  string governed_metadata = 25;    // JSON object of gateway-visible governed metadata (Enterprise); empty when none
  string failover = 26;             // JSON LLMFailover waterfall ({"targets":[{"llm_id":..,"model":".."}],"triggers":{..}}); empty when none
  // Resource signing keys for native API resource IDs (pkg/nativeapi),
  // encrypted like api_key_encrypted. The previous key is still accepted
  // until resource_signing_prev_expires_at; its plaintext "vendor-credential"
  // stands for the key derived from the vendor credential. Empty when the
  // hub has no secret for the LLM: the edge then signs with the
  // vendor-credential key.
  string resource_signing_secret_encrypted = 27;
  string resource_signing_secret_prev_encrypted = 28;
  google.protobuf.Timestamp resource_signing_prev_expires_at = 29;
  string vendor_workspace_id = 30;  // Pinned vendor workspace (Anthropic: anthropic-workspace-id); empty when none
  string price_multipliers = 31;    // JSON object of per-service-tier price multiplier overrides ({"batch":0.4}); empty when none
  // Agent tracing (Enterprise): the content mode cap for calls to this LLM
  // (off|metadata|hashed|redacted|full; empty is no cap), and whether
  // traceparent propagation to its upstream is switched off.
  string tracing_content_mode_max = 32;
  bool tracing_propagation_opt_out = 33;
  // Credential values of metadata (keys named like a key, secret or token:
  // Bedrock's AWS keys), resolved on the hub and encrypted like
  // api_key_encrypted, by metadata key. In metadata those keys carry the
  // refused-credential placeholder, so an edge that does not read this field
  // fails closed; edges lay these values over it.
  map<string, string> metadata_secrets_encrypted = 34;
  // The admin-only "Allow internal host" switch (w4e): the edge exempts
  // only this LLM's own host(s) from internal-address blocking. Edges
  // released before it ignore the field and keep blocking.
  bool allow_internal_host = 35;
}

// AppConfig represents an application configuration with embedded relationships
message AppConfig {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  string owner_email = 4;
  bool is_active = 5;
  double monthly_budget = 6;
  string budget_start_date = 7; // ISO timestamp
  int32 budget_reset_day = 8;
  int32 rate_limit_rpm = 9;
  string allowed_ips = 10; // JSON string
  string metadata = 11; // JSON string
  string namespace = 12; // Namespace for filtering
  uint32 user_id = 13; // Owner user ID (synced from control plane for analytics)
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;

  // Embedded relationship data (from join tables) - THE CRITICAL MISSING PIECE
  repeated uint32 llm_ids = 16;        // From app_llms join table - FOR LLM ACCESS VALIDATION
  repeated uint32 credential_ids = 17; // From credentials table
  repeated uint32 token_ids = 18;      // From api_tokens table

  // Budget usage tracking - synced from control server to edge
  double current_period_usage = 19;    // Current spending in the active budget period (dollars)

  // Tool and Datasource access relationships
  repeated uint32 tool_ids = 20;       // From app_tools join table
  repeated uint32 datasource_ids = 21; // From app_datasources join table

  // Plugin resource associations (generic extensible resource types)
  repeated PluginResourceAssociation plugin_resources = 22;

  // Router grants (Enterprise): from the app_model_routers join table. A
  // router grant lets the App reach the router's LLMs, through the router.
  repeated uint32 model_router_ids = 23;
  // Semantic Router grants (Enterprise): from app_semantic_routers.
  repeated uint32 semantic_router_ids = 24;

  // Agent tracing overrides (Enterprise): JSON models.AppTracingSettings
  // without the hub-only owner_may_view_content; empty when the App
  // inherits every global setting.
  string tracing = 25;
}

// TokenConfig represents an API token configuration
message TokenConfig {
  uint32 id = 1;
  string token = 2;
  string name = 3;
  uint32 app_id = 4;
  string scopes = 5; // JSON string
  bool is_active = 6;
  string expires_at = 7; // ISO timestamp (nullable)
  string last_used_at = 8; // ISO timestamp (nullable)
  string namespace = 9; // NEW: Namespace for filtering
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// ModelPriceConfig represents model pricing information
message ModelPriceConfig {
  uint32 id = 1;
  string vendor = 2;
  string model_name = 3;
  double cpt = 4; // Cost per token (completion/output)
  double cpit = 5; // Cost per input token (prompt)
  double cache_write_pt = 6; // Cost per cache write token
  double cache_read_pt = 7; // Cost per cache read token
  string currency = 8;
  string namespace = 9; // NEW: Namespace for filtering
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// FilterConfig represents a filter configuration
message FilterConfig {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  string script = 4;
  bool is_active = 5;
  int32 order_index = 6;
  string namespace = 7; // NEW: Namespace for filtering
  repeated uint32 llm_ids = 8; // Associated LLM IDs
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  bool response_filter = 11; // true = response filter, false = request filter
  string kind = 12;          // "script" (default) or "guardrail"
  string config = 13;        // JSON guardrails.Config for a guardrail filter, connection secrets resolved
}

// PluginConfig represents a plugin configuration
message PluginConfig {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  string command = 4;
  string checksum = 5;
  string config = 6; // JSON string
  string hook_type = 7;
  bool is_active = 8;
  string namespace = 9; // NEW: Namespace for filtering
  repeated uint32 llm_ids = 10; // Associated LLM IDs
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  repeated string service_scopes = 13; // Service API scopes (for plugins with service access)
  repeated string hook_types = 14; // NEW: All hook types this plugin supports (for hybrid plugins)
  // Auth plugins for this plugin's /plugins/{slug}/ endpoints, in execution
  // order. Set only for custom_endpoint plugins that have any.
  repeated uint32 auth_plugin_ids = 15;
  // Top-level config values that are a $SECRET/ reference, resolved on the
  // hub and encrypted with the edge encryption key, by config key. The
  // reference itself stays in config; edges lay these values over it.
  map<string, string> config_secrets_encrypted = 16;
  // The admin-only "Allow internal host" switch (w4e): the edge exempts
  // only this plugin's own host(s) from internal-address blocking. Edges
  // released before it ignore the field and keep blocking.
  bool allow_internal_host = 17;
}

// ModelRouterConfig represents a model router configuration (Enterprise)
message ModelRouterConfig {
  uint32 id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  string api_compat = 5; // API compatibility format (e.g., "openai")
  bool is_active = 6;
  string namespace = 7;
  repeated ModelPoolConfig pools = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  repeated uint32 auth_plugin_ids = 11; // Auth plugins for /ai/{slug}, in execution order
}

// SemanticRouterConfig is a Semantic Router (Enterprise). Its routes and
// settings travel as the JSON of pkg/semanticrouting.Config, which the edge
// compiles with the engine; example vectors are computed on the edge and
// never travel, so the snapshot checksum only changes with the configuration.
message SemanticRouterConfig {
  uint32 id = 1;
  string name = 2;
  string slug = 3;
  string namespace = 4;
  bool is_active = 5;
  string config_json = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  repeated uint32 auth_plugin_ids = 9; // Auth plugins for /ai/{slug}, in execution order
}

// ModelPoolConfig represents a pool within a model router
message ModelPoolConfig {
  uint32 id = 1;
  string name = 2;
  string model_pattern = 3; // Glob pattern for model matching (e.g., "claude-*")
  string selection_algorithm = 4; // "round_robin" or "weighted"
  int32 priority = 5; // Higher priority pools are checked first
  repeated PoolVendorConfig vendors = 6;
  reserved 7; // Was: mappings (moved to PoolVendorConfig for vendor-specific mappings)
}

// PoolVendorConfig represents an LLM vendor within a pool
message PoolVendorConfig {
  uint32 id = 1;
  uint32 llm_id = 2;
  string llm_slug = 3; // Denormalized for quick lookup
  int32 weight = 4; // Used for weighted selection
  bool is_active = 5;
  repeated ModelMappingConfig mappings = 6; // Vendor-specific model name mappings
}

// ModelMappingConfig represents a model name mapping for a vendor
message ModelMappingConfig {
  uint32 id = 1;
  string source_model = 2; // Model name from request
  string target_model = 3; // Model name to send to this vendor
}

// ToolConfig represents a tool configuration with embedded relationships
message ToolConfig {
  uint32 id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  string tool_type = 5;
  string oas_spec = 6;                  // Base64-encoded OpenAPI spec
  string available_operations = 7;      // Comma-separated operation IDs
  int32 privacy_score = 8;
  string auth_key_encrypted = 9;        // Encrypted for edge transit (resolved from secrets)
  string auth_schema_name = 10;
  bool is_active = 11;
  string namespace = 12;
  string metadata = 13;                 // JSON string
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;

  // Embedded relationship data (from join tables)
  repeated uint32 filter_ids = 16;      // From tool_filters join table
  repeated uint32 app_ids = 17;         // From app_tools join table
  string governed_metadata = 18;        // JSON object of gateway-visible governed metadata (Enterprise); empty when none

  // Access methods. Inverted so that a hub that predates them (fields absent,
  // false) leaves both methods on, which is what such a hub's tools expect.
  bool rest_access_disabled = 19;       // true: /tools/{slug} is refused
  bool mcp_access_disabled = 20;        // true: /tools/{slug}/mcp is refused

  // Auth plugins for /tools/{slug} and its MCP transports, in execution
  // order. When set they alone authenticate requests to the tool.
  repeated uint32 auth_plugin_ids = 21;

  // Agent tracing content mode cap for calls to this tool (Enterprise);
  // empty is no cap.
  string tracing_content_mode_max = 22;
  // The admin-only "Allow internal host" switch (w4e): the edge exempts
  // only this tool's own host(s) from internal-address blocking. Edges
  // released before it ignore the field and keep blocking.
  bool allow_internal_host = 23;
}

// DatasourceConfig represents a datasource configuration
message DatasourceConfig {
  uint32 id = 1;
  string name = 2;
  string short_description = 3;
  string long_description = 4;
  string icon = 5;
  string url = 6;
  int32 privacy_score = 7;
  string db_source_type = 8;
  string db_conn_string_encrypted = 9;  // Encrypted connection string
  string db_conn_api_key_encrypted = 10;// Encrypted API key for vector store
  string db_name = 11;
  string embed_vendor = 12;
  string embed_url = 13;
  string embed_api_key_encrypted = 14;  // Encrypted embedder API key
  string embed_model = 15;
  bool is_active = 16;
  string namespace = 17;
  string metadata = 18;                 // JSON string
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;

  // Embedded relationship data (from join tables)
  repeated uint32 app_ids = 21;         // From app_datasources join table
  string governed_metadata = 22;        // JSON object of gateway-visible governed metadata (Enterprise); empty when none

  // Auth plugins for /datasource/{slug}, in execution order. When set they
  // alone authenticate requests to the datasource.
  repeated uint32 auth_plugin_ids = 23;

  // Agent tracing content mode cap for calls to this datasource
  // (Enterprise); empty is no cap.
  string tracing_content_mode_max = 24;
  // The admin-only "Allow internal host" switch (w4e): the edge exempts
  // only this datasource (vector store)'s own host(s) from internal-address blocking. Edges
  // released before it ignore the field and keep blocking.
  bool allow_internal_host = 25;
  // The switch of the datasource's embedder: its own, or its LLM's for a
  // linked one.
  bool embed_allow_internal_host = 26;
}

// OAuthClientConfig represents an OAuth 2.0 client (synced to edges for MCP auth)
message OAuthClientConfig {
  uint32 id = 1;
  string client_id = 2;
  string client_secret_hash = 3;        // bcrypt hash - safe to transmit
  string client_name = 4;
  string redirect_uris = 5;             // Comma-separated redirect URIs
  uint32 user_id = 6;
  string scope = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// AccessTokenConfig represents an OAuth 2.0 access token (synced to edges for MCP auth)
message AccessTokenConfig {
  uint32 id = 1;
  string token_encrypted = 2;           // Encrypted token string for secure transit
  string client_id = 3;
  uint32 user_id = 4;
  string scope = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string token_hash = 9;                // SHA-256 hash for O(1) lookup on edge (no decryption needed)
  uint32 app_id = 10;                   // App selected at consent; the token is authorised against this app's tools (0 = unbound, authorises nothing)
}

// ConfigurationSnapshot represents a complete configuration state
message ConfigurationSnapshot {
  string version = 1; // NEW: Configuration version for tracking
  repeated LLMConfig llms = 2;
  repeated AppConfig apps = 3;
  // tokens removed - will be validated on-demand via gRPC
  repeated ModelPriceConfig model_prices = 4;
  repeated FilterConfig filters = 5;
  repeated PluginConfig plugins = 6;
  string edge_namespace = 7; // Namespace this snapshot is filtered for
  google.protobuf.Timestamp snapshot_time = 8;
  repeated ModelRouterConfig model_routers = 9; // Enterprise: Model router configurations
  string checksum = 10; // SHA-256 checksum of serialized snapshot (excluding volatile fields)

  // Tool and Datasource configurations
  repeated ToolConfig tools = 11;
  repeated DatasourceConfig datasources = 12;

  // OAuth state for MCP authentication on edges
  repeated OAuthClientConfig oauth_clients = 13;
  repeated AccessTokenConfig access_tokens = 14;

  repeated SemanticRouterConfig semantic_routers = 15; // Enterprise: Semantic routers

  // Entries the hub left out of this snapshot because an edge could not
  // store them (a key edges keep unique, such as a tool slug, used twice),
  // one line each. Edges report them with their own (pkg/snapshotguard).
  repeated string omitted_entries = 16;

  // Agent Call Tracing (Enterprise): the fingerprint key edges use, present
  // only while tracing runs on the hub.
  AgentTracingKeys agent_tracing_keys = 17;

  // Agent Call Tracing (Enterprise): the install-wide content settings edges
  // apply before capture leaves them, present only while tracing runs on
  // the hub. Without it an edge captures no content.
  AgentTracingContentPolicy agent_tracing_content_policy = 18;
}

// AgentTracingContentPolicy is the hub's global content capture settings
// (spec §5.5, §11). App and resource overrides travel on their own configs.
message AgentTracingContentPolicy {
  string default_mode = 1;
  string max_request_override = 2;
  string store_cap = 3;
  uint32 max_part_bytes = 4;
  uint32 max_span_bytes = 5;
  bool store_binary = 6;
  repeated string redaction_detectors = 7;
  // assembled_export_active is set while the hub's OTel exporter exports
  // assembled agent-trace spans under the gateway span id; edges then leave
  // out their own live proxy span for captured requests (one call, one span).
  bool assembled_export_active = 8;
  // ceiling is the highest content mode any App, request header or the
  // default may reach (jyx.172). Missing (an older hub) is off.
  string ceiling = 9;
}

// AgentTracingKeys carries the HMAC key edges compute Agent Call Tracing
// fingerprints with (decision D4). It is derived from the hub's root key
// with HKDF, never the root itself, and travels encrypted with the
// microgateway encryption key. Edges hold it in memory only.
message AgentTracingKeys {
  uint32 key_id = 1;                  // 1..255, the first byte of every fingerprint
  string hmac_key_encrypted = 2;      // base64 key, encrypted like LLM API keys
}

// ConfigurationChange represents a single configuration change
message ConfigurationChange {
  enum ChangeType {
    CREATE = 0;
    UPDATE = 1;
    DELETE = 2;
  }
  
  enum EntityType {
    LLM = 0;
    APP = 1;
    TOKEN = 2;
    MODEL_PRICE = 3;
    FILTER = 4;
    PLUGIN = 5;
    MODEL_ROUTER = 6;
    TOOL = 7;
    DATASOURCE = 8;
    OAUTH_CLIENT = 9;
    ACCESS_TOKEN = 10;
    SEMANTIC_ROUTER = 11;
  }
  
  ChangeType change_type = 1;
  EntityType entity_type = 2;
  uint32 entity_id = 3;
  string entity_data = 4; // JSON serialized entity data
  string namespace = 5;   // Namespace of the changed entity
  google.protobuf.Timestamp timestamp = 6;
}

// HealthStatus represents the health status of an instance
message HealthStatus {
  enum Status {
    HEALTHY = 0;
    DEGRADED = 1;
    UNHEALTHY = 2;
  }

  Status status = 1;
  string message = 2;
  google.protobuf.Timestamp timestamp = 3;
  map<string, string> metrics = 4; // Additional health metrics
}

// PluginResourceAssociation represents plugin resource instances associated with an app.
// Used in ConfigurationSnapshot to propagate plugin resource bindings to gateways.
message PluginResourceAssociation {
  uint32 plugin_id = 1;                            // Plugin that owns this resource type
  string resource_type_slug = 2;                   // Resource type identifier
  repeated string instance_ids = 3;                // Associated instance IDs
  repeated ResourceInstanceSnapshot instances = 4; // Instance details for gateway-side access
}

// ResourceInstanceSnapshot contains instance details included in config snapshots
// so gateways can access resource metadata without calling back to Studio.
message ResourceInstanceSnapshot {
  string id = 1;
  string name = 2;
  int32 privacy_score = 3;
  bytes metadata = 4;                              // Opaque plugin-defined JSON
}